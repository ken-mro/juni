/* ---- 更新と描画 ---- */
function update(dt) {
  if (game.started && !game.over && !game.paused) {
    /* 残り時間。ラストスパート突入は1回だけ、秒が変わるごとにカウント音 */
    const prevSec = Math.ceil(game.timeLeft);
    game.timeLeft -= dt;
    const sec = Math.ceil(game.timeLeft);
    if (!game.spurt && game.timeLeft <= CONFIG.LAST_SPURT) {
      game.spurt = true;
      floaters.push({
        x: fieldW / 2, y: fieldH * 0.28, text: `ラスト${CONFIG.LAST_SPURT}秒！`,
        t: 0, life: 1.4, kind: "spurt",
      });
    }
    if (game.spurt && sec !== prevSec && sec > 0) SFX.timeTick();
    if (game.timeLeft <= 0) {
      game.timeLeft = 0;
      finishGame(false);
    }

    spawnTimer += dt;
    const interval = spawnIntervalFor(game.level);
    /* 場が薄ければ間隔を待たずに補充する(1分間、手持ち無沙汰を作らない) */
    const short = meteors.length < CONFIG.METEOR_MIN && spawnTimer >= CONFIG.SPAWN_MIN_GAP;
    if (!game.over && (meteors.length === 0 || short ||
        (spawnTimer >= interval && meteors.length < CONFIG.METEOR_MAX))) {
      spawnTimer = 0;
      spawnMeteor();
    }
    for (const m of meteors) {
      m.y += m.speed * dt;
      m.rot += m.rotSpeed * dt;
    }
    const landed = meteors.filter((m) => m.y + m.ry >= fieldH);
    if (landed.length) {
      meteors = meteors.filter((m) => m.y + m.ry < fieldH);
      if (landed.includes(lockedTarget)) lockedTarget = null;
      for (const m of landed) onLanded(m);
    }
  }
  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += CONFIG.PARTICLE_GRAVITY * dt;
  }
  particles = particles.filter((p) => p.t < p.life);
  for (const b of beams) b.t += dt;
  beams = beams.filter((b) => b.t < b.life);
  for (const c of confetti) {
    c.t += dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.vy += CONFIG.CONFETTI_GRAVITY * dt;
    c.rot += c.rotSpeed * dt;
  }
  confetti = confetti.filter((c) => c.t < c.life);
  for (const f of floaters) {
    f.t += dt;
    f.y -= 32 * dt;
  }
  floaters = floaters.filter((f) => f.t < f.life);
  dangerFlash = Math.max(0, dangerFlash - dt * 1.5);
  shake = Math.max(0, shake - dt * CONFIG.SHAKE_DECAY);
  /* 空の色を目標へなじませる */
  const tg = skyFor(game.level);
  const k = Math.min(1, dt * CONFIG.SKY_LERP);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) sky[i][j] += (tg[i][j] - sky[i][j]) * k;
  updateTimer();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);

  /* 岩体: ジッタ付き楕円 + 大気圏で燃える縁 */
  ctx.save();
  ctx.rotate(m.rot * 0.1);
  ctx.beginPath();
  const n = m.shape.length;
  for (let i = 0; i <= n; i++) {
    const th = (i % n) / n * Math.PI * 2;
    const j = m.shape[i % n];
    const px = Math.cos(th) * m.rx * j;
    const py = Math.sin(th) * m.ry * j;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  /* ロック中は岩を少し明るく、縁とにじみを照準色にして「いま撃っている隕石」を示す */
  const locked = m === lockedTarget;
  ctx.shadowColor = locked ? PALETTE.METEOR_GLOW_LOCK : PALETTE.METEOR_GLOW;
  ctx.shadowBlur = locked ? CONFIG.LOCK_GLOW_BLUR : CONFIG.METEOR_GLOW_BLUR;
  ctx.fillStyle = locked ? PALETTE.METEOR_BODY_LOCK : PALETTE.METEOR_BODY;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = locked ? PALETTE.METEOR_EDGE_LOCK : PALETTE.METEOR_EDGE;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* クレーター */
  ctx.fillStyle = PALETTE.CRATER;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(
      (m.seeds[i] - 0.5) * m.rx * 1.1,
      (m.seeds[i + 3] - 0.5) * m.ry * 1.1,
      2 + m.seeds[i + 2] * 4, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ヒビ: 消した文字数ぶん放射状に */
  ctx.strokeStyle = PALETTE.CRACK;
  ctx.lineWidth = 1.2;
  for (let c = 0; c < m.charIdx; c++) {
    const a0 = m.seeds[c % 8] * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    let cx = 0, cy = 0;
    for (let s = 1; s <= 3; s++) {
      cx = Math.cos(a0 + (m.seeds[(c + s) % 8] - 0.5)) * (m.ry * s) / 3.2;
      cy = Math.sin(a0 + (m.seeds[(c + s) % 8] - 0.5)) * (m.ry * s) / 3.2;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* ロック中の照準: 四隅のブラケットが明滅する */
  if (m === lockedTarget) {
    const pad = 10;
    const bx = m.rx + pad;
    const by = m.ry + pad;
    const arm = 12;
    ctx.strokeStyle = PALETTE.LOCK;
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(lastTime / 1000 * 6);
    ctx.lineWidth = 2;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(sx * bx - sx * arm, sy * by);
      ctx.lineTo(sx * bx, sy * by);
      ctx.lineTo(sx * bx, sy * by - sy * arm);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* 残りの読み: 次に打つ文字をハイライト、残りは淡く */
  ctx.font = METEOR_FONT_STR;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const rest = m.word.len - m.charIdx;
  let tx = -((rest - 1) * CHAR_ADVANCE) / 2;
  for (let i = m.charIdx; i < m.word.len; i++) {
    const ch = displayChar(m, i);
    ctx.lineWidth = 3;
    ctx.strokeStyle = PALETTE.CHAR_OUTLINE;
    ctx.strokeText(ch, tx, 0);
    ctx.fillStyle = i === m.charIdx ? PALETTE.CHAR_NEXT : PALETTE.CHAR_REST;
    ctx.fillText(ch, tx, 0);
    tx += CHAR_ADVANCE;
  }
  ctx.restore();
}

const FONT_UI = "'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', sans-serif";

/* 地球: フィールド下端に地平線として見える上端の一片(中心は画面下の遠く)。
   大気のにじみ → 海 → 円で切り抜いた陸地の順。装飾であり着地判定は canvas 下端のまま */
function drawEarth() {
  const r = fieldW * CONFIG.EARTH_R;
  const cx = fieldW / 2;
  const cy = fieldH - CONFIG.EARTH_H + r;
  ctx.save();
  ctx.fillStyle = PALETTE.EARTH_ATMO;
  ctx.beginPath();
  ctx.arc(cx, cy, r + CONFIG.EARTH_H * 0.6, 0, Math.PI * 2);
  ctx.fill();
  const sea = ctx.createLinearGradient(0, fieldH - CONFIG.EARTH_H, 0, fieldH);
  sea.addColorStop(0, PALETTE.EARTH_OCEAN);
  sea.addColorStop(1, PALETTE.EARTH_OCEAN_DEEP);
  ctx.fillStyle = sea;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.clip();
  /* 陸地: 幅に対する固定位置の楕円(見えるのは地平線に掛かる部分だけ) */
  ctx.fillStyle = PALETTE.EARTH_LAND;
  const top = fieldH - CONFIG.EARTH_H;
  const h = CONFIG.EARTH_H;
  for (const [fx, w, dy] of [[0.18, 0.22, 0.55], [0.52, 0.14, 0.35], [0.82, 0.2, 0.7]]) {
    ctx.beginPath();
    ctx.ellipse(fieldW * fx, top + h * dy, fieldW * w * 0.5, h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ビーム: 発射口の光 + 外側のにじみ + 細い芯。残留時間に応じて薄れる */
function drawBeams() {
  if (!beams.length) return;
  ctx.save();
  ctx.lineCap = "round";
  for (const b of beams) {
    const a = 1 - b.t / b.life;
    const scale = b.boom ? CONFIG.BEAM_BOOM_SCALE : 1;
    ctx.globalAlpha = a;
    ctx.strokeStyle = PALETTE.BEAM;
    ctx.lineWidth = CONFIG.BEAM_GLOW_W * scale;
    ctx.beginPath();
    ctx.moveTo(b.x0, b.y0);
    ctx.lineTo(b.x1, b.y1);
    ctx.stroke();
    ctx.strokeStyle = PALETTE.BEAM_CORE;
    ctx.lineWidth = CONFIG.BEAM_W * scale;
    ctx.stroke();
    /* 発射口の閃光と着弾点の光点 */
    const mr = CONFIG.MUZZLE_R * scale * (0.6 + 0.4 * a);
    const flash = ctx.createRadialGradient(b.x0, b.y0, 0, b.x0, b.y0, mr);
    flash.addColorStop(0, PALETTE.BEAM_CORE);
    flash.addColorStop(0.4, PALETTE.MUZZLE);
    flash.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = flash;
    ctx.beginPath();
    ctx.arc(b.x0, b.y0, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = PALETTE.BEAM_CORE;
    ctx.beginPath();
    ctx.arc(b.x1, b.y1, CONFIG.BEAM_W * scale * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* 紙吹雪: モーダルより上の #fx canvas に描く。粒が無い間は描画せず透明のまま。
   大きさはウィンドウに合わせて必要になったときだけ揃える(常時のリサイズ監視はしない) */
const fxCv = document.getElementById("fx");
const fxCtx = fxCv.getContext("2d");
let fxHadConfetti = false;
function drawFx() {
  if (!confetti.length) {
    if (fxHadConfetti) {
      fxCtx.clearRect(0, 0, fxCv.width, fxCv.height);
      fxHadConfetti = false;
    }
    return;
  }
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.MAX_DPR);
  const w = Math.round(window.innerWidth * dpr);
  const h = Math.round(window.innerHeight * dpr);
  if (fxCv.width !== w || fxCv.height !== h) {
    fxCv.width = w;
    fxCv.height = h;
  }
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (const c of confetti) {
    fxCtx.globalAlpha = Math.min(1, (1 - c.t / c.life) * 3);
    fxCtx.fillStyle = c.color;
    fxCtx.setTransform(dpr, 0, 0, dpr, c.x * dpr, c.y * dpr);
    fxCtx.rotate(c.rot);
    fxCtx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
  }
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxCtx.globalAlpha = 1;
  fxHadConfetti = true;
}

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, fieldH);
  grad.addColorStop(0, rgbStr(sky[0]));
  grad.addColorStop(1, rgbStr(sky[1]));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, fieldW, fieldH);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);

  /* 星: それぞれの位相で瞬く */
  const now = lastTime / 1000;
  ctx.fillStyle = PALETTE.STAR;
  for (const s of stars) {
    ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(now * s.sp + s.ph));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawEarth();

  /* ロック中の隕石は最後に描いて最前面に(重なっても文字が読めるように) */
  for (const m of meteors) if (m !== lockedTarget) drawMeteor(m);
  if (lockedTarget && meteors.includes(lockedTarget)) drawMeteor(lockedTarget);

  drawBeams();

  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.t / f.life;
    if (f.kind === "combo" || f.kind === "spurt") {
      /* 出た瞬間に少し大きく、すぐ定位置へ縮む */
      const pop = 1 + Math.max(0, 0.25 - f.t) * 2;
      ctx.fillStyle = f.kind === "combo" ? PALETTE.FLOAT_COMBO : PALETTE.FLOAT_SPURT;
      ctx.font = `800 ${Math.round(22 * pop)}px ${FONT_UI}`;
      ctx.fillText(f.text, f.x, f.y);
    } else if (f.kind === "penalty") {
      ctx.fillStyle = PALETTE.FLOAT_PENALTY;
      ctx.font = `800 22px ${FONT_UI}`;
      ctx.fillText(f.text, f.x, f.y);
    } else {
      ctx.fillStyle = PALETTE.FLOAT_WORD;
      ctx.font = `bold 16px ${FONT_UI}`;
      ctx.fillText(f.text, f.x, f.y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 危険ライン: 隕石がここ(=キーパッド上端)に達したら撃破数が1戻る */
  ctx.fillStyle = `rgba(${PALETTE.DANGER_RGB}, ${0.35 + dangerFlash * 0.65})`;
  const lh = CONFIG.DANGER_LINE_H + dangerFlash * 3;
  ctx.fillRect(0, fieldH - lh, fieldW, lh);

  drawFx();
}

/* ---- 次のキーのヒント: ロック中の隕石(なければ最下部)の期待入力を
   キーパッド上で光らせる。フリック方向は表示しない(隕石の文字を見て打たせる) ---- */
let lastHint = ""; // 行IDのキャッシュ(毎フレームのDOM操作を避ける)

function updateHint() {
  let token = null;
  if (settings.hint && game.started && !game.over && !game.paused) {
    let m = lockedTarget;
    if (!m) for (const c of meteors) if (!c || !m || c.y > m.y) m = c;
    if (m) token = expectedToken(m);
  }
  let row = null;
  if (token !== null) {
    for (const r of KEY_LAYOUT) {
      if (FLICK_MAP[r].includes(token)) { row = r; break; }
    }
  }
  const sig = row ?? "";
  if (sig === lastHint) return;
  lastHint = sig;
  for (const r of KEY_LAYOUT) keyEls[r].classList.remove("hint");
  if (row) keyEls[row].classList.add("hint");
}

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05); // タブ復帰時の暴走防止
  lastTime = now;
  update(dt);
  updateHint();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   フリック入力判定 (Pointer Events で統一。touchstart は使わない)
   pointerdown でキーを掴み、pointerup 時点の移動量で方向を確定
   ============================================================ */
const activePointers = new Map(); // pointerId → { key, x0, y0, guide }

/* 移動量 → 方向。atan2は使わず軸比較で四方向に落とす(斜めの取りこぼし防止) */
function dirFrom(dx, dy) {
  if (Math.max(Math.abs(dx), Math.abs(dy)) < CONFIG.FLICK_THRESHOLD) return DIR_CENTER;
  if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? DIR_LEFT : DIR_RIGHT;
  return dy < 0 ? DIR_UP : DIR_DOWN;
}

/* ---- フリックガイド: 押したキーの上に小さな十字で候補を出す ---- */
function makeGuide(row, rect) {
  const g = document.createElement("div");
  g.className = "guide";
  const cell = CONFIG.GUIDE_CELL;
  const step = cell + CONFIG.GUIDE_GAP;
  const size = cell + step * 2; // 十字全体の幅・高さ(3マス分)

  /* キー中央の真上に置き、画面端では内側にずらして見切れを防ぐ */
  let cx = rect.left + rect.width / 2;
  cx = Math.min(Math.max(cx, size / 2 + 4), window.innerWidth - size / 2 - 4);
  const originX = cx - size / 2;
  const originY = rect.top - CONFIG.GUIDE_LIFT - size;

  /* [中央, 左, 上, 右, 下] → 十字内の(列, 行) */
  const grid = [[1, 1], [0, 1], [1, 0], [2, 1], [1, 2]];
  g.cells = FLICK_MAP[row].map((kana, d) => {
    if (kana === null) return null;
    const c = document.createElement("div");
    const label = kana === MOD ? "小゛゜" : kana;
    c.className = "cell" + (label.length > 1 ? " sub" : "");
    c.textContent = label;
    c.style.left = originX + grid[d][0] * step + "px";
    c.style.top = originY + grid[d][1] * step + "px";
    c.style.width = cell + "px";
    c.style.height = cell + "px";
    g.appendChild(c);
    return c;
  });
  document.body.appendChild(g);
  return g;
}

function highlightGuide(g, dir) {
  for (const c of g.cells) c?.classList.remove("on");
  g.cells[dir]?.classList.add("on");
}

padEl.addEventListener("pointerdown", (e) => {
  SFX.ensure(); // AudioContextはユーザー操作の中でしか起こせない
  if (settings.bgm && game.started && !game.over) BGM.start(); // 再生中の呼び出しは何もしない
  const key = e.target.closest(".key");
  if (!key) return;
  key.setPointerCapture(e.pointerId);
  let guide = null;
  if (settings.guide) {
    guide = makeGuide(key.dataset.row, key.getBoundingClientRect());
    highlightGuide(guide, DIR_CENTER);
  }
  activePointers.set(e.pointerId, { key, x0: e.clientX, y0: e.clientY, guide });
  key.classList.add("pressed");
});

padEl.addEventListener("pointermove", (e) => {
  const p = activePointers.get(e.pointerId);
  if (!p || !p.guide) return;
  highlightGuide(p.guide, dirFrom(e.clientX - p.x0, e.clientY - p.y0));
});

function releasePointer(e) {
  const p = activePointers.get(e.pointerId);
  if (!p) return null;
  activePointers.delete(e.pointerId);
  p.key.classList.remove("pressed");
  p.guide?.remove();
  return p;
}

padEl.addEventListener("pointerup", (e) => {
  const p = releasePointer(e);
  if (!p) return;
  const dir = dirFrom(e.clientX - p.x0, e.clientY - p.y0);
  const kana = FLICK_MAP[p.key.dataset.row][dir];
  if (kana === null) return; // 存在しない方向は無反応
  onInput(kana, dir);
});

padEl.addEventListener("pointercancel", releasePointer);

padEl.addEventListener("contextmenu", (e) => e.preventDefault());

/* ---- 確定入力をゲームへ渡す ---- */
const chipEl = document.getElementById("chip");

function onInput(kana, dir) {
  chipEl.classList.remove("miss");
  chipEl.textContent = `${kana === MOD ? "小゛゜" : kana}　${DIR_LABELS[dir]}`;
  const hit = handleGameInput(kana);
  if (hit !== null) recordInput(kana, dir, hit);
}
</script>
</body>

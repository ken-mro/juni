<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>十二 JŪNI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231b1252'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%23ffd93d'>十</text></svg>">
<style>
/* ============================================================
   調整用定数（レイアウト系）— CSSカスタムプロパティ
   ゲームプレイ系の数値は <script> 先頭の CONFIG にある
   ============================================================ */
:root {
  /* 縦配分: HUD(固定) + フィールド(残り全部) + キーパッド(固定) */
  --hud-h: 54px;              /* HUDの高さ */
  --pad-h: min(34dvh, 320px); /* キーパッド全体の高さ(親指の可動域に収める) */
  --pad-gap: 6px;             /* キー間の隙間 */
  --pad-pad: 8px;             /* キーパッド外周の余白 */
  --pad-side: clamp(24px, 9vw, 56px); /* キーパッド左右の空き(端のキーのフリック用) */
  --lv-h: 38px;               /* 開始レベル選択の1マスの高さ */
  --lv-gap: 6px;              /* 開始レベル選択のマス間の隙間 */
  --lv-rows: 2;               /* 開始レベル選択の表示段数(10個=2段。超えたぶんはスクロール) */

  /* パレット: ビビッドな宇宙。深い紫の空に、黄・シアン・ピンクのネオンが差す */
  --bg-deep:    #1b1252;  /* 最深部の紫(体の背景) */
  --bg-field:   #3f2fae;  /* フィールド下端の明るい藍 */
  --panel:      #241b6e;  /* オーバーレイのパネル面 */
  --line:       #4238a6;  /* 区切り線・枡の枠 */
  --key-face:   #3a2f97;  /* キー面(上) */
  --key-face-2: #2c2378;  /* キー面(下) */
  --key-edge:   #6a5fd6;  /* キーの縁 */
  --key-shadow: #17104a;  /* キーの厚み */
  --text:       #ffffff;
  --dim:        #bdb8f2;  /* 非活性・補助テキスト(ラベンダー) */
  --ember:      #ffd93d;  /* 主アクセント: 星の黄。次に打つ文字・強調 */
  --cyan:       #4ff0e6;  /* 副アクセント: コンボ・ロック */
  --pink:       #ff6fb5;  /* 副アクセント: グラデーションの相方 */
  --danger:     #ff5c7a;  /* 警告(ラスト10秒・ミス) */
  --ok:         #7dffb0;  /* 改善(↑) */

  --font-display: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-ui: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100dvh;               /* 100vhはモバイルのアドレスバーで破綻する */
  overflow: hidden;
  touch-action: none;           /* 画面の引っ張り・ダブルタップズームを殺す */
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-ui);
}

#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---- HUD: 左=ロゴ / 中央=タイマー / 右=レベル(進行ゲージ)・コンボ ---- */
#hud {
  flex: none;
  height: calc(var(--hud-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 12px 0 14px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
#hud .wordmark {
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 0.25em;
  font-weight: 600;
  white-space: nowrap; /* 狭い端末で「十二」が縦積みにならないように */
}
#hud .wordmark small {
  font-family: var(--font-ui);
  font-size: 9px;
  letter-spacing: 0.35em;
  color: var(--dim);
  margin-left: 6px;
  vertical-align: 2px;
}
@media (max-width: 380px) {
  #hud .wordmark small { display: none; } /* 狭い端末ではJŪNIを省く */
}
#hud .label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--dim);
}
.hud-center { text-align: center; }
.hud-center .time {
  display: block;
  font-size: 30px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.hud-center .time.warn {
  color: var(--danger);
  animation: pulse 0.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
.hud-right {
  display: flex;
  justify-content: flex-end;
  gap: clamp(8px, 3vw, 18px);
  font-variant-numeric: tabular-nums;
}
#hud .stat { text-align: right; }
#hud .stat .value { display: block; font-size: 17px; line-height: 1.15; font-weight: 700; }
#hud .stat .value.combo { color: var(--cyan); }
.gauge {
  width: 64px;
  height: 4px;
  margin: 3px 0 0 auto;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.15);
  overflow: hidden;
}
.gauge i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--ember), var(--pink));
  transition: width 0.25s;
}

/* ---- フィールド (canvas) ---- */
#field {
  flex: 1 1 auto;
  min-height: 0;      /* flex子のcanvasがはみ出さないために必須 */
  position: relative;
}
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ---- キーパッド (DOM) ---- */
#pad {
  flex: none;
  height: calc(var(--pad-h) + env(safe-area-inset-bottom));
  padding: var(--pad-pad) calc(var(--pad-pad) + var(--pad-side))
           calc(var(--pad-pad) + env(safe-area-inset-bottom))
           calc(var(--pad-pad) + var(--pad-side));
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--pad-gap);
  background: linear-gradient(#22186a, var(--bg-deep));
  border-top: 1px solid var(--line);
}
.key {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(var(--key-face), var(--key-face-2));
  border: 1px solid var(--key-edge);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--key-shadow);
  font-family: var(--font-ui);
  font-size: clamp(20px, 3.6dvh, 28px);
  font-weight: 600;
  color: var(--text);
  touch-action: none;
}

/* 次に打つキーのヒント: キーが光る(フリック方向は示さない — 隕石を見て打たせる) */
.key.hint {
  border-color: var(--ember);
  box-shadow: 0 3px 0 var(--key-shadow), 0 0 16px rgba(255, 217, 61, 0.45);
}
.key.sub { font-size: clamp(14px, 2.4dvh, 19px); color: var(--dim); }
.key.pressed,
.key:active {
  background: var(--key-edge);
  border-color: var(--ember);
  box-shadow: none;
  transform: translateY(2px);
}

/* ---- フリックガイド (押下中に5方向の候補を表示) ---- */
.guide {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 10;
  pointer-events: none;
}
.guide .cell {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #5a4fd0;
  border: 1px solid #8a80ea;
  border-radius: 8px;
  font-size: 17px;
  color: var(--text);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
}
.guide .cell.sub { font-size: 10px; }
.guide .cell.on {
  background: var(--ember);
  border-color: var(--ember);
  color: var(--bg-deep);
}

/* ---- 入力チップ: 直前に確定した入力を小さく表示 ---- */
#chip {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 8px;
  font-size: 13px;
  letter-spacing: 0.15em;
  color: var(--dim);
  pointer-events: none;
  transition: color 0.3s;
}
#chip.miss { color: var(--danger); transition: none; }

/* ---- オーバーレイ(スタート・リザルト・一時停止・設定) ---- */
#overlay,
#settings,
#start,
#pause {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(27, 18, 82, 0.72);
}
#overlay.hidden,
#settings.hidden,
#start.hidden,
#pause.hidden { display: none; }
#overlay .panel,
#settings .panel,
#start .panel,
#pause .panel {
  width: min(84vw, 350px);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px 22px 20px;
  touch-action: pan-y; /* パネル自体も縦スクロール可(body は touch-action: none) */
  background: var(--panel);
  border: 1px solid var(--key-edge);
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  text-align: center;
}
#overlay .go-title,
#settings .go-title,
#pause .go-title {
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: 0.3em;
  margin-bottom: 12px;
}
#overlay .go-title {
  background: linear-gradient(90deg, var(--ember), var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* リザルトの主役: 到達レベルを大きく */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin: 4px 0 10px;
}
.hero .label { font-size: 10px; letter-spacing: 0.25em; color: var(--dim); }
.hero .lv-big {
  font-size: 58px;
  font-weight: 800;
  line-height: 1;
  color: var(--ember);
  font-variant-numeric: tabular-nums;
}
.hero .lv-big small {
  font-size: 14px;
  letter-spacing: 0.2em;
  color: var(--dim);
  margin-right: 8px;
  vertical-align: 16px;
}
.hero .rank {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.2em;
  color: var(--cyan);
}
.hero .rank b { font-size: 24px; margin-left: 4px; }

#overlay .row {
  display: flex;
  justify-content: space-between;
  padding: 6px 2px;
  font-size: 14px;
  color: var(--dim);
  border-bottom: 1px solid var(--line);
}
#overlay .row b {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 8px;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--ember), var(--pink));
  color: var(--bg-deep);
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
  vertical-align: 2px;
}
.badge.hidden { display: none; }
#overlay .sec-title,
#start .sec-title {
  margin-top: 16px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--dim);
  border-bottom: 1px solid var(--line);
  padding-bottom: 5px;
}
.rowgrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  margin-top: 8px;
}
.rowgrid .cell,
.dircross .cell {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 7px;
  padding: 6px 0 5px;
  font-size: 11px;
  color: var(--dim);
}
.rowgrid .cell b,
.dircross .cell b {
  display: block;
  font-size: 13px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.cell.warn b { color: var(--ember); }
.cell.bad b { color: var(--danger); }
.cell.na b { color: var(--dim); }
i.up, i.down { font-style: normal; font-size: 10px; margin-left: 1px; }
i.up { color: var(--ok); }
i.down { color: var(--danger); }
.dircross {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  width: 72%;
  margin: 8px auto 0;
}
.dircross .blank { visibility: hidden; }

/* ---- 開始レベル選択(スタート画面) ---- */
.level-picker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--lv-gap);
  margin-top: 8px;
  /* 2段ぶんの高さに固定し、解放レベルが増えたら枠内でスクロールする */
  max-height: calc(var(--lv-h) * var(--lv-rows) + var(--lv-gap) * (var(--lv-rows) - 1));
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y; /* body の touch-action: none を上書きして縦スクロールを許す */
  scrollbar-width: thin;
  scrollbar-color: var(--key-edge) transparent;
}
.lv {
  height: var(--lv-h);
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.lv.active {
  background: linear-gradient(135deg, var(--ember), var(--pink));
  border-color: transparent;
  color: var(--bg-deep);
}
.lv.locked {
  color: rgba(255, 255, 255, 0.28);
  border-style: dashed;
  background: none;
  cursor: default;
}
.lv-desc {
  margin: 6px 2px 0;
  font-size: 11px;
  line-height: 1.7;
  color: var(--dim);
  min-height: 1.7em;
}
.best-line {
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--dim);
}
.best-line b { color: var(--ember); font-variant-numeric: tabular-nums; }

.ghost {
  margin-top: 10px;
  width: 100%;
  padding: 10px 0;
  border: 1px solid var(--key-edge);
  border-radius: 10px;
  background: none;
  color: var(--dim);
  font-family: var(--font-ui);
  font-size: 14px;
  letter-spacing: 0.2em;
  cursor: pointer;
}

/* 三次的な操作(設定など)は控えめなリンク風にする */
.linklike {
  margin-top: 12px;
  background: none;
  border: none;
  color: var(--dim);
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.15em;
  padding: 6px 10px;
  cursor: pointer;
}

#go-retry,
#st-close,
#btn-start,
#btn-resume {
  margin-top: 20px;
  width: 100%;
  padding: 13px 0;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--ember), var(--pink));
  color: var(--bg-deep);
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.2em;
  box-shadow: 0 6px 18px rgba(255, 111, 181, 0.35);
  cursor: pointer;
}
#btn-start { margin-top: 14px; } /* レベル選択の直下に置く */

/* ---- 設定・一時停止ボタン(フィールド右下) ---- */
#btn-settings,
#btn-pause {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(58, 47, 151, 0.7);
  border: 1px solid var(--key-edge);
  color: var(--dim);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#btn-pause { right: 60px; }

/* ---- スタート画面 ---- */
#start .start-title {
  font-family: var(--font-display);
  font-size: 38px;
  letter-spacing: 0.3em;
  font-weight: 600;
  background: linear-gradient(90deg, var(--ember), var(--pink), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
#start .start-title small {
  display: block;
  font-family: var(--font-ui);
  font-size: 10px;
  letter-spacing: 0.5em;
  color: var(--dim);
  margin-top: 6px;
  -webkit-text-fill-color: var(--dim);
}
#start .start-copy {
  margin: 14px 0 2px;
  font-size: 13px;
  color: var(--text);
  letter-spacing: 0.05em;
}
#start .start-rules {
  text-align: left;
  font-size: 12px;
  color: var(--dim);
  line-height: 1.9;
  padding-left: 1.3em;
  margin: 8px 0 0;
}
.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  color: var(--text);
}
.toggle input {
  appearance: none;
  -webkit-appearance: none;
  width: 44px;
  height: 24px;
  border-radius: 12px;
  background: var(--line);
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
}
.toggle input:checked { background: var(--ember); }
.toggle input::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text);
  transition: left 0.15s;
}
.toggle input:checked::after { left: 22px; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <span class="wordmark">十二<small>JŪNI</small></span>
    <div class="hud-center">
      <span class="label">TIME</span>
      <span class="time" id="hud-time">60</span>
    </div>
    <div class="hud-right">
      <div class="stat">
        <span class="label">LEVEL</span>
        <span class="value" id="hud-level">1</span>
        <div class="gauge"><i id="hud-progress"></i></div>
      </div>
      <div class="stat"><span class="label">COMBO</span><span class="value combo" id="hud-combo">0</span></div>
    </div>
  </header>
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="chip"></div>
    <button id="btn-pause" aria-label="一時停止"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.2" y="1.5" width="3.4" height="11" rx="1.4" fill="currentColor"/><rect x="8.4" y="1.5" width="3.4" height="11" rx="1.4" fill="currentColor"/></svg></button>
    <button id="btn-settings" aria-label="設定">⚙&#xFE0E;</button>
  </div>
  <div id="pad"></div>
</div>

<div id="overlay" class="hidden">
  <div class="panel">
    <div class="go-title">TIME UP!</div>
    <div class="hero">
      <span class="label">到達レベル <em id="go-newbest" class="badge hidden">記録更新</em></span>
      <div class="lv-big"><small>LEVEL</small><span id="go-level">1</span></div>
      <div class="rank">RANK<b id="go-rank">C</b></div>
    </div>
    <div class="row"><span>自己ベスト</span><b id="go-best">—</b></div>
    <div class="row"><span>撃破</span><b id="go-destroyed">0</b></div>
    <div class="row"><span>最大コンボ</span><b id="go-combo">0</b></div>
    <div class="sec-title">行別 正答率（↑↓ 前回比）</div>
    <div id="go-rows" class="rowgrid"></div>
    <div class="sec-title">方向別 ミス率</div>
    <div id="go-dirs" class="dircross"></div>
    <button id="go-retry">もう一度</button>
  </div>
</div>

<div id="start">
  <div class="panel">
    <div class="start-title">十二<small>JŪNI</small></div>
    <p class="start-copy">1分間で、どこまでレベルを上げられる？</p>
    <div class="sec-title">あそびかた</div>
    <ul class="start-rules">
      <li>隕石のことばをフリック入力で破壊</li>
      <li>撃破を重ねるとレベルアップ。字種が増え、速くなる</li>
      <li>落としてもOK。コンボが切れるだけ</li>
    </ul>
    <div class="sec-title">開始レベル</div>
    <div id="level-picker" class="level-picker"></div>
    <p id="level-desc" class="lv-desc"></p>
    <p class="best-line">自己ベスト <b id="start-best">—</b></p>
    <button id="btn-start">スタート</button>
    <button id="btn-start-settings" class="linklike">⚙&#xFE0E; 設定</button>
  </div>
</div>

<div id="pause" class="hidden">
  <div class="panel">
    <div class="go-title">一時停止</div>
    <button id="btn-resume">再開</button>
    <button id="btn-pause-retry" class="ghost">やり直す</button>
  </div>
</div>

<div id="settings" class="hidden">
  <div class="panel">
    <div class="go-title">設定</div>
    <label class="toggle"><span>入力ガイド</span><input type="checkbox" id="st-guide" checked></label>
    <label class="toggle"><span>次のキーのヒント</span><input type="checkbox" id="st-hint" checked></label>
    <label class="toggle"><span>効果音</span><input type="checkbox" id="st-sfx" checked></label>

/* 小゛゜による変換サイクル: 清音→濁音(→半濁音)→清音 / 清音→小文字→清音 */

];
const CYCLE_NEXT = {};
const CHAR_CYCLE = {}; // 文字 → { cycle, i } (サイクル文字列と自分の位置)
for (const cycle of CYCLES) {
  for (let i = 0; i < cycle.length; i++) {
    CYCLE_NEXT[cycle[i]] = cycle[(i + 1) % cycle.length];
    CHAR_CYCLE[cycle[i]] = { cycle, i };
  }
}

/* 1文字を打つのに必要な入力列。例: が→[か,MOD] ぱ→[は,MOD,MOD] ね→[ね] */
function inputSeq(ch) {
  const c = CHAR_CYCLE[ch];
  return c ? [c.cycle[0], ...Array(c.i).fill(MOD)] : [ch];
}

/* ============================================================
   語彙モジュール: 正規化・難易度解析・バリデーション
   ============================================================ */
const DAKUTEN_BASE = {
  "が": "か", "ぎ": "き", "ぐ": "く", "げ": "け", "ご": "こ",
  "ざ": "さ", "じ": "し", "ず": "す", "ぜ": "せ", "ぞ": "そ",
  "だ": "た", "ぢ": "ち", "づ": "つ", "で": "て", "ど": "と",
  "ば": "は", "び": "ひ", "ぶ": "ふ", "べ": "へ", "ぼ": "ほ",
  "ゔ": "う",
};
const HANDAKUTEN_BASE = {
  "ぱ": "は", "ぴ": "ひ", "ぷ": "ふ", "ぺ": "へ", "ぽ": "ほ",
};
const SMALL_BASE = {
  "ぁ": "あ", "ぃ": "い", "ぅ": "う", "ぇ": "え", "ぉ": "お",
  "っ": "つ", "ゃ": "や", "ゅ": "ゆ", "ょ": "よ", "ゎ": "わ",
};

/* 単語には使えないが入力は可能な記号(かな→行の表から除外する) */
const NON_WORD_CHARS = new Set([..."「」、。？！"]);

/* かな(清音・ー) → 所属するキー行。FLICK_MAP から導出 */
const KANA_ROW = {};
for (const row of KEY_LAYOUT) {
  for (const kana of FLICK_MAP[row]) {
    if (kana && kana !== MOD && !NON_WORD_CHARS.has(kana)) KANA_ROW[kana] = row;
  }
}

/* が→か、ぱ→は、ゃ→や の正規化 */
function toBase(ch) {
  return DAKUTEN_BASE[ch] ?? HANDAKUTEN_BASE[ch] ?? SMALL_BASE[ch] ?? ch;
}

/* 所属する行("か" など)。かなでなければ null */
function rowOf(base) {
  return KANA_ROW[base] ?? null;
}

/* 清音0、濁音1、半濁音2、小文字1 の追加アクション数 */
function extraCost(ch) {
  if (ch in DAKUTEN_BASE) return COST.dakuten;
  if (ch in HANDAKUTEN_BASE) return COST.handakuten;
  if (ch in SMALL_BASE) return COST.small;
  return 0;
}

/* 濁音/半濁音/小文字/長音のビットフラグ */
const FLAG = { DAKUTEN: 1, HANDAKUTEN: 2, SMALL: 4, CHOUON: 8 };

/* 読み → { actions, rows, flags, len }
   actions = 実際のフリック回数の合計。難易度の基準はこの値(文字数ではない) */
function analyze(kana) {
  let actions = 0;
  let flags = 0;
  const rows = new Set();
  for (const ch of kana) {
    rows.add(rowOf(toBase(ch)));
    actions += 1 + extraCost(ch);
    if (ch in DAKUTEN_BASE) flags |= FLAG.DAKUTEN;
    if (ch in HANDAKUTEN_BASE) flags |= FLAG.HANDAKUTEN;
    if (ch in SMALL_BASE) flags |= FLAG.SMALL;
    if (ch === "ー") flags |= FLAG.CHOUON;
  }
  return { actions, rows: [...rows], flags, len: [...kana].length };
}

/* 読みの検査。問題なければ null、あれば理由を返す */
function validateReading(reading) {
  if (!reading) return "空文字";
  if (/[ァ-ヺ]/.test(reading)) return "カタカナを含む";
  if (/[一-鿿々]/.test(reading)) return "漢字を含む";
  if (reading.includes(" ")) return "半角スペースを含む";
  for (const ch of reading) {
    if (rowOf(toBase(ch)) === null) return `想定外の文字「${ch}」`;
  }
  return null;
}

/* 起動時に全単語を検査・解析。問題のある語は警告してスキップ */
const LEXICON = [];
for (const raw of WORDS) {
  const parts = raw.split("|");
  const reason = parts.length > 2 ? "「|」が2つ以上ある" : validateReading(parts[0]);
  if (reason) {
    console.warn(`単語をスキップ: "${raw}" — ${reason}`);
    continue;
  }
  LEXICON.push({ reading: parts[0], display: parts[1] ?? null, ...analyze(parts[0]) });
}
console.log(`[語彙] ${LEXICON.length}/${WORDS.length} 語を読み込み`);

/* ============================================================
   レベル定義: 解放される行と許可フラグ
   長音(ー)はわ行の解放と同時に出るため常に許可
   ============================================================ */
const ALL_ROWS = ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ"];
const LEVELS = [
  { rows: ["あ", "か", "さ"], flags: FLAG.CHOUON, label: "あ・か・さ" },
  { rows: ["あ", "か", "さ", "た", "な", "は"], flags: FLAG.CHOUON, label: "＋た・な・は" },
  { rows: ALL_ROWS, flags: FLAG.CHOUON, label: "＋ま・や・ら・わ" },
  { rows: ALL_ROWS, flags: FLAG.CHOUON | FLAG.DAKUTEN | FLAG.HANDAKUTEN, label: "濁音・半濁音" },
  { rows: ALL_ROWS, flags: FLAG.CHOUON | FLAG.DAKUTEN | FLAG.HANDAKUTEN | FLAG.SMALL, label: "小文字・拗音" },
];
/* レベルの見出し。LEVELS を超えたら速度だけが上がる */
function levelLabel(level) {
  return level <= LEVELS.length ? LEVELS[level - 1].label : "全字種・スピードアップ";
}

/* レベルごとの出題プールを起動時に確定しておく */
const LEVEL_POOLS = LEVELS.map((def) => LEXICON.filter((w) =>
  w.rows.every((r) => def.rows.includes(r)) && (w.flags & ~def.flags) === 0));
console.log(`[語彙] レベル別プール: ${LEVEL_POOLS.map((p) => p.length).join(" / ")}`);

/* ---- キーパッド生成 (DOM) ---- */
const padEl = document.getElementById("pad");
const keyEls = {}; // 行ID → キー要素(ヒント表示で使う)
for (const row of KEY_LAYOUT) {

  key.textContent = label;
  padEl.appendChild(key);
  keyEls[row] = key;
}

function hexToRgb(hex) {

  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ============================================================
   隕石: 生成・落下・ターゲティング・破壊
   ============================================================ */
const METEOR_FONT_STR = `bold ${CONFIG.METEOR_FONT}px "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif`;
const CHAR_ADVANCE = CONFIG.METEOR_FONT * 1.15; // 1文字ぶんの送り幅

let meteors = [];
let particles = [];

/* 難易度スケール。L1〜L5はテーブル、L6以降はレベルに比例して伸び続ける */
function speedScale() {
  if (game.level <= 5) return CONFIG.LEVEL_SPEED[game.level - 1];
  return CONFIG.LEVEL_SPEED[4] * (1 + (game.level - 5) * CONFIG.ENDLESS_SPEED_PER_LEVEL);
}
function spawnScale() {
  if (game.level <= 5) return CONFIG.LEVEL_SPAWN[game.level - 1];
  return Math.max(
    CONFIG.LEVEL_SPAWN[4] * (1 - (game.level - 5) * CONFIG.ENDLESS_SPAWN_PER_LEVEL),
    0.01);
}

/* そのレベルで次に上がるのに必要な撃破数 */
function killsToNext(level) {
  return CONFIG.LEVEL_KILLS[level - 1] ?? CONFIG.ENDLESS_KILLS_PER_LEVEL;
}

let recentWords = []; // 直近に出題した読み(重複出題の回避用)

/* 現在レベルのプールから単語を選ぶ。
   優先順: 先頭入力が場と重複しない かつ 直近に出ていない
   → 先頭のみ重複しない → 完全ランダム(妥協) */
function pickWord(pool) {
  const tryPick = (checkRecent) => {
    for (let i = 0; i < CONFIG.SPAWN_RETRY; i++) {
      const cand = pool[Math.floor(Math.random() * pool.length)];
      const first = inputSeq([...cand.reading][0])[0];
      if (meteors.some((m) => expectedToken(m) === first)) continue;
      if (checkRecent && recentWords.includes(cand.reading)) continue;
      return cand;
    }
    return null;
  };
  return tryPick(true) ?? tryPick(false) ??
    pool[Math.floor(Math.random() * pool.length)];
}

function spawnMeteor() {
  const pool = LEVEL_POOLS[Math.min(game.level, LEVELS.length) - 1];
  const word = pickWord(pool);
  recentWords.push(word.reading);
  recentWords = recentWords.slice(-CONFIG.RECENT_WORDS);
  const chars = [...word.reading].map((ch) => ({ ch, tokens: inputSeq(ch) }));
  const rx = Math.max((word.len * CHAR_ADVANCE) / 2 + 14, 40);
  const ry = CONFIG.METEOR_RY + word.len * 1.5;
  const margin = rx + 8;
  const speedJitter = 1 + (Math.random() * 2 - 1) * CONFIG.FALL_SPEED_VAR;
  meteors.push({
    word, chars,
    charIdx: 0,   // 何文字目まで消したか
    charProg: 0,  // 現在の文字に入力済みのトークン数
    x: margin + Math.random() * Math.max(fieldW - margin * 2, 1),
    y: ry + 6, // 画面上部に全体が見える位置から落ち始める

    rx, ry,
    speed: CONFIG.FALL_SPEED * speedScale() * speedJitter,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() * 2 - 1) * 0.3,
    /* 岩の輪郭(半径ジッタ)と、ヒビ・クレーターの乱数は生成時に固定 */
    shape: Array.from({ length: 11 }, () => 0.82 + Math.random() * 0.36),
    seeds: Array.from({ length: 8 }, () => Math.random()),
  });
}

/* いま消しかけの文字の表示形。か→(MOD)→が の途中経過を見せる */

  const ch = m.chars[i].ch;

  return CHAR_CYCLE[ch].cycle[m.charProg - 1];

/* midiノート番号 → 周波数(69 = A4 = 440Hz)。効果音とBGMで共用 */
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* ============================================================
   効果音: Web Audio APIによる合成音(外部ファイルなし)
   モバイルの制約により、最初のタッチで AudioContext を起こす
   ============================================================ */
const SFX = (() => {
  let ctx = null;
  let master = null;
  let muted = false;

  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : CONFIG.SOUND_VOLUME;
      master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  function tone(freq, dur, { type = "sine", vol = 0.3, slide = 0, delay = 0 } = {}) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(freq + slide, 30), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g).connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function noise(dur, { vol = 0.4, freq = 800, delay = 0 } = {}) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(freq, t0);
    filter.frequency.exponentialRampToValueAtTime(100, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(filter).connect(g).connect(master);
    src.start(t0);
  }

  /* 一連のメロディ(midi配列)を等間隔で鳴らす */
  function melody(notes, step, dur, opts) {
    notes.forEach((m, i) => tone(midiHz(m), dur, { ...opts, delay: (opts.delay ?? 0) + i * step }));
  }

  const MAJOR = [0, 2, 4, 5, 7, 9, 11]; // 長音階の度数(コンボで登る)

  return {
    ensure,
    state: () => ctx?.state ?? "none",
    /* BGMとAudioContextを共有するための参照(二重生成の回避) */
    context: () => ctx,
    /* 効果音のミュート(BGMには影響しない) */
    setMuted(m) {
      muted = m;
      if (master) master.gain.value = m ? 0 : CONFIG.SOUND_VOLUME;
    },
    /* 正解入力。コンボが乗るほど長音階を1音ずつ登る(2オクターブで頭打ち) */
    tick(combo) {
      const i = Math.min(combo, 14);
      tone(midiHz(72 + MAJOR[i % 7] + 12 * Math.floor(i / 7)), 0.07, { type: "triangle", vol: 0.18 });
    },
    /* 1文字削れた(ヒビ) */
    crack() { noise(0.07, { vol: 0.12, freq: 3000 }); tone(520, 0.08, { type: "square", vol: 0.1, slide: 200 }); },
    /* 隕石破壊: 低い衝撃 + 上昇するチャイム */
    boom() {
      noise(0.3, { vol: 0.4, freq: 1400 });
      tone(110, 0.3, { vol: 0.45, slide: -60 });
      melody([79, 84], 0.06, 0.12, { type: "square", vol: 0.1, delay: 0.02 });
    },
    /* ミス入力: 短く低いブザー */
    miss() { tone(180, 0.14, { type: "square", vol: 0.18, slide: -60 }); },
    /* 隕石着地: 軽い「ぽん」。ライフは減らないので警報にしない */
    land() {
      tone(320, 0.22, { vol: 0.4, slide: -200 });
      noise(0.16, { vol: 0.25, freq: 900 });
    },
    /* レベルアップ: 長三和音のアルペジオ + きらめき */
    levelUp() {
      melody([72, 76, 79, 84], 0.08, 0.25, { type: "triangle", vol: 0.25 });
      tone(1568, 0.5, { type: "sine", vol: 0.12, slide: 500, delay: 0.3 });
    },
    /* コンボ節目: 高い完全五度の2音 */
    comboMilestone() {
      melody([88, 95], 0.07, 0.18, { type: "square", vol: 0.12 });
    },
    /* ラストスパートの秒カウント */
    timeTick() { tone(1320, 0.05, { type: "triangle", vol: 0.16 }); },
    /* 時間切れ: 上昇して終わる明るいジングル */
    timeUp() {
      melody([67, 72, 76, 79], 0.12, 0.3, { type: "triangle", vol: 0.28, delay: 0.15 });
      [72, 76, 79, 84].forEach((m) => tone(midiHz(m), 0.9, { type: "triangle", vol: 0.12, delay: 0.65 }));
    },
    /* 記録更新: 駆け上がるきらめき */
    newRecord() {
      melody([79, 81, 83, 84, 86, 88, 91], 0.05, 0.25, { type: "triangle", vol: 0.14, delay: 1.4 });
    },
  };
})();

/* ============================================================
   BGM: Web Audio APIによるチップチューン(音源ファイルなし・手続き生成)
   構成: 25%パルス波のリード + 三角波ベース(オクターブ跳躍)
       + 16分で回る矩形波のチップコード + ノイズ打楽器(キック/スネア/ハット)
   setTimeoutのドリフトを避けるため、AudioContextのcurrentTimeを
   基準にした先読みスケジューラで正確な時刻に発音を予約する。
   AudioContextはSFXと共有し、二重生成しない。
   ============================================================ */
const BGM = (() => {
  /* --- 曲定義: Cメジャー 8小節の王道進行を2周(16小節)。
     C | G | Am | F | C | G | F | G  midiノート番号で記述 --- */
  const CHORDS = [
    { bass: 36, tones: [60, 64, 67] }, // C
    { bass: 43, tones: [59, 62, 67] }, // G
    { bass: 45, tones: [60, 64, 69] }, // Am
    { bass: 41, tones: [60, 65, 69] }, // F
    { bass: 36, tones: [60, 64, 67] }, // C
    { bass: 43, tones: [59, 62, 67] }, // G
    { bass: 41, tones: [60, 65, 69] }, // F
    { bass: 43, tones: [59, 62, 67] }, // G
  ];
  /* リード: 1小節=8分×8。数値=発音、"-"=前の音を伸ばす、null=休符 */
  const MELODY = [
    [76, 76, 79, "-", 76, 74, 72, "-"],
    [74, 74, 79, "-", 74, 72, 71, "-"],
    [72, 72, 76, "-", 81, 79, 76, "-"],
    [77, 76, 74, 76, 77, "-", 79, "-"],
    [79, "-", 76, 72, 76, 79, 84, "-"],
    [83, "-", 79, 74, 79, 83, 86, "-"],
    [84, 81, 77, 81, 84, "-", 81, 79],
    [79, "-", 83, "-", 84, "-", "-", null],
    [76, 76, 79, "-", 76, 74, 72, "-"],
    [74, 74, 79, "-", 74, 72, 71, "-"],
    [72, 72, 76, "-", 81, 79, 76, "-"],
    [77, 76, 74, 76, 77, "-", 79, "-"],
    [84, 83, 81, 79, 76, "-", 79, "-"],
    [83, 81, 79, 77, 74, "-", 79, "-"],
    [77, 79, 81, 84, 81, 79, 77, 76],
    [74, "-", 76, "-", 72, "-", "-", null],
  ];
  const BASS_OCT = [0, 0, 12, 0, 0, 12, 0, 12]; // ベース: 8分ごとのオクターブ跳躍
  const PULSE_DUTY = 0.25;  // リードのパルス幅(25% = 定番のチップ音)
  const LOOKAHEAD = 1.2;    // 何秒先まで発音を予約するか
  const TICK_MS = 250;      // スケジューラの起床間隔(ms)。精度には影響しない

  let ac = null;        // SFXと共有するAudioContext
  let bus = null;       // BGM全体のゲイン(フェードイン/アウト用)
  let delaySend = null; // リードの残響(ディレイ)への送り口
  let leadOut = null;   // リードの出力(ローパス→bus、少量を残響へ)
  let pulseWave = null; // 25%パルス波(PeriodicWave)。一度作れば使い回す
  let noiseBuf = null;  // ハット/スネア用の共有ノイズバッファ(毎回作らない)
  let timer = null;
  let running = false;
  let barIdx = 0;
  let nextBarTime = 0;

  /* レベル追従: 高レベルほど速く・リズムが密に。ラストスパートでさらに加速。
     値は小節の境界でしか反映されないため急変しない */
  function mood() {
    const lv = Math.min(game.level, CONFIG.BGM_LEVEL_CAP) - 1;
    const bpm = CONFIG.BGM_BPM + lv * CONFIG.BGM_BPM_PER_LEVEL +
      (game.spurt ? CONFIG.BGM_SPURT_BPM_ADD : 0);
    return {
      spb: 60 / bpm,                // 1拍の秒数
      drive: Math.min(lv / 6, 1),   // 追加キック/16分ハットの音量係数(0→1)
    };
  }

  /* BGMの出力バスと残響を組み立てる。開始のたびに作り直し、
     停止時に切り離すことで前回セッションの鳴り残りを持ち込まない */
  function buildGraph() {
    bus = ac.createGain();
    bus.gain.value = 0.0001;
    bus.connect(ac.destination);
    const delay = ac.createDelay(1.0);
    delay.delayTime.value = 0.34; // 付点8分相当。テンポ変化に合わせ毎小節微調整
    const damp = ac.createBiquadFilter();
    damp.type = "lowpass";
    damp.frequency.value = 2600; // 繰り返すほど残響が丸くなる
    const fb = ac.createGain();
    fb.gain.value = 0.28;        // 残響のフィードバック量
    const wet = ac.createGain();
    wet.gain.value = 0.35;       // 残響の返し量
    delay.connect(damp);
    damp.connect(fb).connect(delay); // フィードバックループ
    delay.connect(wet).connect(bus);
    delaySend = delay;
    /* リード: 高域を少し丸めてから出す。残響へは控えめに送る */
    leadOut = ac.createBiquadFilter();
    leadOut.type = "lowpass";
    leadOut.frequency.value = 5200;
    leadOut.connect(bus);
    const send = ac.createGain();
    send.gain.value = 0.3;
    leadOut.connect(send).connect(delaySend);
    if (!pulseWave) {
      /* 矩形波の各倍音を sin(nπd) で重み付けするとパルス幅 d の波になる */
      const N = 32;
      const real = new Float32Array(N);
      const imag = new Float32Array(N);
      for (let n = 1; n < N; n++) imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * PULSE_DUTY);
      pulseWave = ac.createPeriodicWave(real, imag);
    }
    if (!noiseBuf) {
      const len = Math.ceil(ac.sampleRate * 0.25);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
  }

  /* --- 音色: いずれも短命ノードの使い捨て(stop予約済みなのでGCされる) --- */

  /* キック: 正弦波のピッチを一気に落とす定番の合成 */
  function kick(t, vol) {
    if (vol < 0.01) return; // 音量ゼロ相当はノード自体を作らない(低レベル時の省負荷)
    const osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(48, t + 0.09);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    osc.connect(g).connect(bus);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  /* ノイズ打楽器: ハット(高域・極短)とスネア(中域・短)を兼ねる */
  function noiseHit(t, vol, freq, dur, type) {
    if (vol < 0.01) return;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(bus);
    src.start(t, Math.random() * 0.1); // 再生開始位置をずらし同一音の繰返し感を消す
    src.stop(t + dur + 0.02);
  }

  /* ベース: 三角波の短い1音(丸くて跳ねる) */
  function bassNote(t, freq, dur) {
    const osc = ac.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(bus);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* チップコード: 矩形波の極短音。3声を16分で回して和音に聞かせる */
  function chordNote(t, freq, dur, lp) {
    const osc = ac.createOscillator();
    osc.type = "square";
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.028, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(lp);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* リード: 25%パルス波。素早く立ち上がり、少し減衰して保持する */
  function leadNote(t, freq, dur) {
    const osc = ac.createOscillator();
    osc.setPeriodicWave(pulseWave);
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.1, t + 0.07);
    g.gain.setValueAtTime(0.1, t + Math.max(dur - 0.03, 0.08));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(leadOut);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* 1小節(4拍)ぶんをまとめて t0 から予約する。小節の長さ(秒)を返す */
  function scheduleBar(t0) {
    const { spb, drive } = mood();
    const e8 = spb / 2;  // 8分音符の長さ(秒)
    const e16 = spb / 4; // 16分音符の長さ(秒)
    const chord = CHORDS[barIdx % CHORDS.length];
    const mel = MELODY[barIdx];
    const isTurn = barIdx === MELODY.length - 1; // ループの折り返し小節
    barIdx = (barIdx + 1) % MELODY.length;

    /* 残響の長さをテンポに追従させる(付点8分) */
    delaySend.delayTime.setTargetAtTime(spb * 0.75, t0, 0.5);

    /* リード: "-" が続くぶん音を伸ばす */
    for (let i = 0; i < 8; i++) {
      const n = mel[i];
      if (typeof n !== "number") continue;
      let len = 1;
      while (i + len < 8 && mel[i + len] === "-") len++;
      leadNote(t0 + i * e8, midiHz(n), e8 * len - 0.02);
    }

    /* チップコード: 16分で3声を回す(ローパスで角を取る) */
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 2400;
    lp.connect(bus);
    for (let i = 0; i < 16; i++) {
      chordNote(t0 + i * e16, midiHz(chord.tones[i % 3]), e16 * 0.9, lp);
    }

    /* ベース: 8分刻みのオクターブ跳躍が推進力を作る */
    for (let i = 0; i < 8; i++) {
      bassNote(t0 + i * e8, midiHz(chord.bass + BASS_OCT[i]), e8 * 0.9);
    }

    /* ドラム: キックは1・3拍(レベルが上がると2・4拍が加わり四つ打ちへ)、
       スネアは2・4拍、ハットは8分裏(レベルが上がると16分が加わる) */
    for (let b = 0; b < 4; b++) {
      const t = t0 + b * spb;
      kick(t, b % 2 === 0 ? 0.42 : 0.42 * drive);
      if (b % 2 === 1) noiseHit(t, 0.1, 1800, 0.12, "bandpass");        // スネア
      noiseHit(t + spb * 0.5, 0.045, 6500, 0.04, "highpass");           // 8分裏ハット
      noiseHit(t + spb * 0.25, 0.03 * drive, 7500, 0.03, "highpass");   // 16分ハット
      noiseHit(t + spb * 0.75, 0.03 * drive, 7500, 0.03, "highpass");
    }
    /* 折り返し小節の終わりにスネアの助走(次のループへの期待感) */
    if (isTurn) {
      noiseHit(t0 + spb * 3.5, 0.07, 1800, 0.1, "bandpass");
      noiseHit(t0 + spb * 3.75, 0.09, 1800, 0.1, "bandpass");
    }
    return spb * 4;
  }

  /* 先読みスケジューラ本体。LOOKAHEAD先までの小節をまとめて予約する */
  function tick() {
    const ahead = ac.currentTime + LOOKAHEAD;
    while (nextBarTime < ahead) nextBarTime += scheduleBar(nextBarTime);
  }

  /* 開始(再開)。再生中は何もしないので毎タッチ呼んでよい */
  function start() {
    if (running || CONFIG.BGM_VOLUME <= 0) return;
    SFX.ensure(); // ユーザー操作内で呼ばれる前提(自動再生制限)
    ac = SFX.context();
    if (!ac) return;
    if (bus) bus.disconnect(); // 前回セッションの鳴り残りを切り離す
    buildGraph();
    running = true;
    const t = ac.currentTime;
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.exponentialRampToValueAtTime(CONFIG.BGM_VOLUME, t + 0.6);
    barIdx = 0;
    nextBarTime = t + 0.05;
    tick();
    timer = setInterval(tick, TICK_MS);
  }

  /* フェードアウトして停止。使い終えたバスは切り離して破棄する */
  function stop(fade = CONFIG.BGM_FADE_OUT) {
    if (!running) return;
    running = false;
    clearInterval(timer);
    timer = null;
    const t = ac.currentTime;
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), t);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + fade);
    const dead = bus;
    setTimeout(() => {
      if (!running && bus === dead) { dead.disconnect(); bus = null; }
    }, fade * 1000 + 100);
  }

  return { start, stop, bar: () => barIdx };
})();

/* ============================================================
   設定: 入力ガイド / ヒント / 効果音 / BGM / 開始レベル(localStorageに保存)
   ============================================================ */
const SETTINGS_KEY = "juni.settings";
const settings = { guide: true, hint: true, sfx: true, bgm: true, startLevel: 1 };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) ?? {});
} catch {}
delete settings.easy; // 旧バージョンのモード設定は捨てる

}

/* ============================================================
   入力統計: 行別・方向別の正誤を記録する(リザルト画面の核)
   帰属は「実際に打った文字」の行と方向
   ============================================================ */
function newStats() {
  return {
    rows: Object.fromEntries(ALL_ROWS.map((r) => [r, { ok: 0, ng: 0 }])),
    dirs: Array.from({ length: 5 }, () => ({ ok: 0, ng: 0 })),
  };
}
let stats = newStats();

function recordInput(kana, dir, ok) {
  const bucket = ok ? "ok" : "ng";
  stats.dirs[dir][bucket]++;
  if (kana === MOD) return; // 小゛゜は行を持たない(方向のみ記録)
  const row = rowOf(toBase(kana));
  if (row) stats.rows[row][bucket]++; // 句読点・記号は行の統計に含めない
}

/* ---- ゲーム状態: 時間・レベル・コンボ ---- */
const game = {
  combo: 0,
  maxCombo: 0,
  destroyed: 0,
  level: 1,
  levelKills: 0,  // 現在のレベルで積んだ撃破数(次レベルまでの進行)
  startLevel: 1,
  timeLeft: CONFIG.TIME_LIMIT,
  spurt: false,   // ラストスパート演出に入ったか
  started: false, // スタートボタンを押すまでは動かさない
  over: false,
  paused: false,  // 一時停止・設定画面を開いている間
};
let floaters = []; // フィールド上に浮かぶ文字(撃破した語・LEVEL UP・COMBO)

const hudTimeEl = document.getElementById("hud-time");
const hudComboEl = document.getElementById("hud-combo");
const hudLevelEl = document.getElementById("hud-level");
const hudProgressEl = document.getElementById("hud-progress");
const overlayEl = document.getElementById("overlay");

/* 数字が増えた瞬間に弾ませる(Web Animations。クラスの付け外しより単純) */
function bump(el, scale = 1.35) {
  el.animate([{ transform: `scale(${scale})` }, { transform: "scale(1)" }],
    { duration: 180, easing: "ease-out" });
}

function updateHud() {
  hudComboEl.textContent = game.combo;
  hudLevelEl.textContent = game.level;
  hudProgressEl.style.width =
    `${Math.min(game.levelKills / killsToNext(game.level), 1) * 100}%`;
}

let shownSec = -1;      // 表示中の残り秒(毎フレームのDOM更新を避ける)
let shownWarn = false;  // 赤点滅の表示状態
function updateTimer() {
  const sec = Math.max(0, Math.ceil(game.timeLeft));
  const warn = game.spurt && !game.over;
  if (sec !== shownSec) {
    shownSec = sec;
    hudTimeEl.textContent = sec;
  }
  if (warn !== shownWarn) {
    shownWarn = warn;
    hudTimeEl.classList.toggle("warn", warn);
  }
}

/* ターゲティング: ロック中はその隕石だけが対象。
   未ロックなら期待トークンが一致する隕石のうち最も下のものにロックする */
let lockedTarget = null;

function handleGameInput(token) {
  if (!game.started || game.over || game.paused) return null; // 記録対象外
  if (lockedTarget && !meteors.includes(lockedTarget)) lockedTarget = null;
  let target = null;
  if (lockedTarget) {
    if (expectedToken(lockedTarget) === token) target = lockedTarget;
  } else {
    for (const m of meteors) {
      if (expectedToken(m) === token && (!target || m.y > target.y)) target = m;
    }
  }
  if (!target) {
    onMiss(token);
    return false;
  }
  lockedTarget = target;
  game.combo++;
  game.maxCombo = Math.max(game.maxCombo, game.combo);
  SFX.tick(game.combo);
  bump(hudComboEl, 1.25);
  if (game.combo % CONFIG.COMBO_MILESTONE === 0) {
    floaters.push({
      x: fieldW / 2, y: fieldH * 0.28, text: `${game.combo} COMBO!`,
      t: 0, life: 1.2, kind: "combo",
    });
    SFX.comboMilestone();
  }
  target.charProg++;
  if (target.charProg >= target.chars[target.charIdx].tokens.length) {
    target.charIdx++;
    target.charProg = 0;
    spawnParticles(target.x, target.y, CONFIG.HIT_PARTICLES);
  }
  if (target.charIdx >= target.word.len) {
    spawnParticles(target.x, target.y, CONFIG.BOOM_PARTICLES);
    meteors = meteors.filter((m) => m !== target);
    lockedTarget = null;
    SFX.boom();
    onDestroy(target);
  } else if (target.charProg === 0) {
    SFX.crack();
  }
  updateHud();
  return true;
}

function onMiss(token) {
  chipEl.classList.add("miss");
  game.combo = 0;
  SFX.miss();
  updateHud();
}

function onDestroy(meteor) {
  game.destroyed++;
  game.levelKills++;
  /* 撃破した語の表記(漢字)を浮かせる。読みしかない語は読みを出す */
  floaters.push({
    x: meteor.x, y: meteor.y, text: meteor.word.display ?? meteor.word.reading,
    t: 0, life: 0.9, kind: "word",
  });
  while (game.levelKills >= killsToNext(game.level)) {
    game.levelKills -= killsToNext(game.level);
    game.level++;
    floaters.push({
      x: fieldW / 2, y: fieldH * 0.38,
      text: `LEVEL ${game.level}`, sub: levelLabel(game.level),
      t: 0, life: 1.8, kind: "level",
    });
    spawnRing(CONFIG.RING_PARTICLES);
    SFX.levelUp();
    bump(hudLevelEl, 1.5);
  }
}

/* 着地: ライフはない。画面が揺れてコンボが切れるだけ */
function onLanded(meteor) {
  dangerFlash = 1;
  shake = CONFIG.SHAKE_AMP;
  game.combo = 0;
  SFX.land();
  updateHud();
}

/* ---- 記録: 自己ベスト(到達レベル・撃破数・最大コンボ) ---- */
const BEST_KEY = "juni.best";
function loadBest() {
  try {
    const b = JSON.parse(localStorage.getItem(BEST_KEY));
    return { level: 0, destroyed: 0, maxCombo: 0, ...(b ?? {}) };
  } catch { return { level: 0, destroyed: 0, maxCombo: 0 }; } // プライベートモード等
}
function saveBest(b) {
  try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch {}
}
/* 到達レベル → ランク文字 */
function rankFor(level) {
  return (CONFIG.RANKS.find(([min]) => level >= min) ?? CONFIG.RANKS.at(-1))[1];
}

/* 正答率(%)。試行がなければ null */
function accuracy(s) {
  const total = s.ok + s.ng;
  return total ? Math.round((s.ok / total) * 100) : null;
}

function statCell(label, value, cls) {
  return `<div class="cell ${cls}">${label}<b>${value}</b></div>`;
}

/* 前回比の矢印HTML。比較できなければ空 */
function arrowHtml(cur, prev) {
  if (cur == null || prev == null || cur === prev) return "";
  return cur > prev ? '<i class="up">↑</i>' : '<i class="down">↓</i>';
}

/* 成長の記録: ゲームごとの結果と行別正答率を残す(直近20回) */
const HISTORY_KEY = "juni.history";
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) ?? []; }
  catch { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(-20))); } catch {}
}

function renderResultStats(prev) {
  /* 行別 正答率: 低い行ほど強調。↑↓は前回プレイとの比較 */
  document.getElementById("go-rows").innerHTML = ALL_ROWS.map((r) => {
    const acc = accuracy(stats.rows[r]);
    const cls = acc === null ? "na" : acc < 70 ? "bad" : acc < 90 ? "warn" : "";
    const arrow = acc === null ? "" : arrowHtml(acc, prev?.rows?.[r]);
    return statCell(r, acc === null ? "—" : `${acc}%${arrow}`, cls);
  }).join("");

  /* 方向別 ミス率: 十字配置。「下フリックが弱い」を可視化する */
  const dirCell = (dir, label) => {
    const s = stats.dirs[dir];
    const total = s.ok + s.ng;
    const miss = total ? Math.round((s.ng / total) * 100) : null;
    const cls = miss === null ? "na" : miss >= 30 ? "bad" : miss >= 10 ? "warn" : "";
    return statCell(label, miss === null ? "—" : `${miss}%`, cls);
  };
  document.getElementById("go-dirs").innerHTML = [
    '<div class="cell blank"></div>', dirCell(DIR_UP, "↑"), '<div class="cell blank"></div>',
    dirCell(DIR_LEFT, "←"), dirCell(DIR_CENTER, "中央"), dirCell(DIR_RIGHT, "→"),
    '<div class="cell blank"></div>', dirCell(DIR_DOWN, "↓"), '<div class="cell blank"></div>',
  ].join("");
}

/* 時間切れ: 結果を集計してリザルトを出す */
function timeUp() {
  game.over = true;
  hudTimeEl.classList.remove("warn");
  SFX.timeUp();
  BGM.stop(); // ジングルの邪魔をしないようフェードアウト
  const best = loadBest();
  const isNewBest = game.level > best.level ||
    (game.level === best.level && game.destroyed > best.destroyed);
  const nextBest = {
    level: isNewBest ? game.level : best.level,
    destroyed: isNewBest ? game.destroyed : best.destroyed,
    maxCombo: Math.max(best.maxCombo, game.maxCombo),
  };
  saveBest(nextBest);
  const history = loadHistory();
  const prev = history.at(-1) ?? null;
  document.getElementById("go-level").textContent = game.level;
  document.getElementById("go-rank").textContent = rankFor(game.level);
  document.getElementById("go-newbest").classList.toggle("hidden", !isNewBest);
  document.getElementById("go-best").textContent = `LEVEL ${nextBest.level}`;
  document.getElementById("go-destroyed").innerHTML =
    `${game.destroyed}${arrowHtml(game.destroyed, prev?.destroyed)}`;
  document.getElementById("go-combo").innerHTML =
    `${game.maxCombo}${arrowHtml(game.maxCombo, prev?.maxCombo)}`;
  renderResultStats(prev);
  history.push({
    t: Date.now(),
    level: game.level,
    destroyed: game.destroyed,
    maxCombo: game.maxCombo,
    rows: Object.fromEntries(ALL_ROWS.map((r) => [r, accuracy(stats.rows[r])])),
  });
  saveHistory(history);
  if (isNewBest) {
    spawnConfetti(CONFIG.CONFETTI);
    SFX.newRecord();
  }
  overlayEl.classList.remove("hidden");
}

function restart() {
  Object.assign(game, {
    combo: 0, maxCombo: 0, destroyed: 0,
    level: settings.startLevel, levelKills: 0, startLevel: settings.startLevel,
    timeLeft: CONFIG.TIME_LIMIT, spurt: false,
    started: true, over: false, paused: false,
  });
  meteors = [];
  particles = [];
  floaters = [];
  lockedTarget = null;
  stats = newStats();
  recentWords = [];
  spawnTimer = CONFIG.SPAWN_INTERVAL;
  shake = 0;
  dangerFlash = 0;
  sky = skyTarget().map((c) => [...c]); // 開始レベルの空色から始める
  overlayEl.classList.add("hidden");
  if (settings.bgm) BGM.start(); // リトライ(ユーザー操作)の中でBGMを再開
  updateHud();
  shownSec = -1;
  updateTimer();
}
/* 状態を全リセットしてタイトル画面に戻る */
function goToTitle() {
  restart();             // リセット(各オーバーレイも閉じる)
  game.started = false;  // タイトル画面で待機
  renderLevelPicker();   // 直前のプレイで解放レベルが増えていれば反映
  document.getElementById("start").classList.remove("hidden");
}
document.getElementById("go-retry").addEventListener("click", () => {
  SFX.ensure();
  goToTitle();
});

/* ---- スタート画面: 開始レベル選択 + ボタンで開始(この操作でオーディオも起動) ---- */
const startEl = document.getElementById("start");
const pickerEl = document.getElementById("level-picker");
const levelDescEl = document.getElementById("level-desc");
const startBestEl = document.getElementById("start-best");

/* 解放されている最大の開始レベル。自己ベスト − OFFSET(最低1・上限なし) */
function maxStartLevel() {
  return Math.max(1, loadBest().level - CONFIG.START_LEVEL_UNLOCK_OFFSET);
}

function renderLevelPicker() {
  const unlocked = maxStartLevel();
  settings.startLevel = Math.min(Math.max(settings.startLevel, 1), unlocked);
  pickerEl.innerHTML = "";
  /* 最低 START_LEVEL_SHOWN 個。解放が進めばそのぶん伸び、枠内をスクロールする */
  const shown = Math.max(CONFIG.START_LEVEL_SHOWN, unlocked);
  let activeEl = null;
  for (let lv = 1; lv <= shown; lv++) {
    const b = document.createElement("button");
    b.className = "lv" + (lv > unlocked ? " locked" : "") + (lv === settings.startLevel ? " active" : "");
    b.dataset.level = lv;
    b.textContent = lv;
    if (lv > unlocked) b.disabled = true;
    if (lv === settings.startLevel) activeEl = b;
    pickerEl.appendChild(b);
  }
  activeEl?.scrollIntoView({ block: "nearest" }); // 選択中のレベルが枠外に隠れないように
  levelDescEl.textContent = `LEVEL ${settings.startLevel}: ${levelLabel(settings.startLevel)}`;
  const best = loadBest();
  startBestEl.textContent = best.level ? `LEVEL ${best.level}` : "—";
  /* タイトル待機中は背後のHUDと空色も選んだレベルに追従させる */
  if (!game.started) {
    game.level = settings.startLevel;
    updateHud();
  }
}
pickerEl.addEventListener("click", (e) => {
  const b = e.target.closest(".lv");
  if (!b || b.disabled) return;
  settings.startLevel = Number(b.dataset.level);
  saveSettings();
  renderLevelPicker();
});
renderLevelPicker();
sky = skyTarget().map((c) => [...c]); // 起動直後は空色をなじませず即座に合わせる
updateTimer();

document.getElementById("btn-start").addEventListener("click", () => {
  SFX.ensure();
  restart();
  startEl.classList.add("hidden");
});

/* ---- 一時停止: 再開 or 最初からやり直す ---- */
const pauseEl = document.getElementById("pause");
document.getElementById("btn-pause").addEventListener("click", () => {
  if (!game.started || game.over) return;
  game.paused = true;
  pauseEl.classList.remove("hidden");
});
document.getElementById("btn-resume").addEventListener("click", () => {
  pauseEl.classList.add("hidden");
  game.paused = false;
});
document.getElementById("btn-pause-retry").addEventListener("click", () => {

  goToTitle(); // 全リセットしてタイトル画面へ
});

/* ---- 設定画面: 開いている間はゲームを一時停止する ---- */
const settingsEl = document.getElementById("settings");
const stGuideEl = document.getElementById("st-guide");
const stHintEl = document.getElementById("st-hint");
const stSfxEl = document.getElementById("st-sfx");
const stBgmEl = document.getElementById("st-bgm");

function openSettings() {

  stHintEl.checked = settings.hint;
  stSfxEl.checked = settings.sfx;

document.getElementById("btn-start-settings").addEventListener("click", openSettings);

/* ---- 更新と描画 ---- */
function update(dt) {
  if (game.started && !game.over && !game.paused) {
    /* 残り時間。ラストスパート突入は1回だけ、秒が変わるごとにカウント音 */
    const prevSec = Math.ceil(game.timeLeft);
    game.timeLeft -= dt;
    const sec = Math.ceil(game.timeLeft);
    if (!game.spurt && game.timeLeft <= CONFIG.LAST_SPURT) {
      game.spurt = true;
      floaters.push({
        x: fieldW / 2, y: fieldH * 0.28, text: `ラスト${CONFIG.LAST_SPURT}秒！`,
        t: 0, life: 1.4, kind: "spurt",
      });
    }
    if (game.spurt && sec !== prevSec && sec > 0) SFX.timeTick();
    if (game.timeLeft <= 0) {
      game.timeLeft = 0;
      timeUp();
    }

    spawnTimer += dt;
    const interval = Math.max(
      CONFIG.SPAWN_INTERVAL * spawnScale(), CONFIG.SPAWN_INTERVAL_MIN);
    /* 場が薄ければ間隔を待たずに補充する(1分間、手持ち無沙汰を作らない) */
    const short = meteors.length < CONFIG.METEOR_MIN && spawnTimer >= CONFIG.SPAWN_MIN_GAP;
    if (!game.over && (meteors.length === 0 || short ||
        (spawnTimer >= interval && meteors.length < CONFIG.METEOR_MAX))) {
      spawnTimer = 0;
      spawnMeteor();
    }
    for (const m of meteors) {
      m.y += m.speed * dt;
      m.rot += m.rotSpeed * dt;
    }
    const landed = meteors.filter((m) => m.y + m.ry >= fieldH);
    if (landed.length) {
      meteors = meteors.filter((m) => m.y + m.ry < fieldH);
      if (landed.includes(lockedTarget)) lockedTarget = null;
      for (const m of landed) onLanded(m);
    }
  }
  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
  }
  particles = particles.filter((p) => p.t < p.life);
  for (const f of floaters) {
    f.t += dt;
    f.y -= 32 * dt;
  }
  floaters = floaters.filter((f) => f.t < f.life);
  dangerFlash = Math.max(0, dangerFlash - dt * 1.5);
  shake = Math.max(0, shake - dt * CONFIG.SHAKE_DECAY);
  /* 空の色を目標へなじませる */
  const tg = skyTarget();
  const k = Math.min(1, dt * CONFIG.SKY_LERP);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) sky[i][j] += (tg[i][j] - sky[i][j]) * k;
  updateTimer();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);

  /* 岩体: ジッタ付き楕円 + 大気圏で燃える縁 */
  ctx.save();
  ctx.rotate(m.rot * 0.1);
  ctx.beginPath();
  const n = m.shape.length;
  for (let i = 0; i <= n; i++) {
    const th = (i % n) / n * Math.PI * 2;
    const j = m.shape[i % n];
    const px = Math.cos(th) * m.rx * j;
    const py = Math.sin(th) * m.ry * j;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.shadowColor = PALETTE.METEOR_GLOW;
  ctx.shadowBlur = 18;
  ctx.fillStyle = PALETTE.METEOR_BODY;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = PALETTE.METEOR_EDGE;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* クレーター */
  ctx.fillStyle = PALETTE.CRATER;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(
      (m.seeds[i] - 0.5) * m.rx * 1.1,
      (m.seeds[i + 3] - 0.5) * m.ry * 1.1,
      2 + m.seeds[i + 2] * 4, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ヒビ: 消した文字数ぶん放射状に */
  ctx.strokeStyle = PALETTE.CRACK;
  ctx.lineWidth = 1.2;
  for (let c = 0; c < m.charIdx; c++) {
    const a0 = m.seeds[c % 8] * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    let cx = 0, cy = 0;
    for (let s = 1; s <= 3; s++) {
      cx = Math.cos(a0 + (m.seeds[(c + s) % 8] - 0.5)) * (m.ry * s) / 3.2;
      cy = Math.sin(a0 + (m.seeds[(c + s) % 8] - 0.5)) * (m.ry * s) / 3.2;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* ロック中の照準: 四隅のブラケットが明滅する */
  if (m === lockedTarget) {
    const pad = 10;
    const bx = m.rx + pad;
    const by = m.ry + pad;
    const arm = 12;
    ctx.strokeStyle = PALETTE.LOCK;
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(lastTime / 1000 * 6);
    ctx.lineWidth = 2;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(sx * bx - sx * arm, sy * by);
      ctx.lineTo(sx * bx, sy * by);
      ctx.lineTo(sx * bx, sy * by - sy * arm);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* 残りの読み: 次に打つ文字をハイライト、残りは淡く */
  ctx.font = METEOR_FONT_STR;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const rest = m.word.len - m.charIdx;
  let tx = -((rest - 1) * CHAR_ADVANCE) / 2;
  for (let i = m.charIdx; i < m.word.len; i++) {
    const ch = displayChar(m, i);
    ctx.lineWidth = 3;
    ctx.strokeStyle = PALETTE.CHAR_OUTLINE;
    ctx.strokeText(ch, tx, 0);
    ctx.fillStyle = i === m.charIdx ? PALETTE.CHAR_NEXT : PALETTE.CHAR_REST;
    ctx.fillText(ch, tx, 0);
    tx += CHAR_ADVANCE;
  }
  ctx.restore();
}

const FONT_UI = "'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', sans-serif";
const FONT_DISPLAY = "'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif";

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, fieldH);
  grad.addColorStop(0, rgbStr(sky[0]));
  grad.addColorStop(1, rgbStr(sky[1]));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, fieldW, fieldH);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);

  /* 星: それぞれの位相で瞬く */
  const now = lastTime / 1000;
  ctx.fillStyle = PALETTE.STAR;
  for (const s of stars) {
    ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(now * s.sp + s.ph));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const m of meteors) drawMeteor(m);

  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.t / f.life;
    if (f.kind === "level") {
      ctx.fillStyle = PALETTE.FLOAT_LEVEL;
      ctx.font = `32px ${FONT_DISPLAY}`;
      ctx.fillText(f.text, f.x, f.y);
      if (f.sub) {
        ctx.font = `13px ${FONT_UI}`;
        ctx.fillStyle = PALETTE.FLOAT_SUB;
        ctx.fillText(f.sub, f.x, f.y + 24);
      }
    } else if (f.kind === "combo" || f.kind === "spurt") {
      /* 出た瞬間に少し大きく、すぐ定位置へ縮む */
      const pop = 1 + Math.max(0, 0.25 - f.t) * 2;
      ctx.fillStyle = f.kind === "combo" ? PALETTE.FLOAT_COMBO : PALETTE.FLOAT_SPURT;
      ctx.font = `800 ${Math.round(22 * pop)}px ${FONT_UI}`;
      ctx.fillText(f.text, f.x, f.y);
    } else {
      ctx.fillStyle = PALETTE.FLOAT_WORD;
      ctx.font = `bold 16px ${FONT_UI}`;
      ctx.fillText(f.text, f.x, f.y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 危険ライン: 隕石がここ(=キーパッド上端)に達したらコンボが切れる */
  ctx.fillStyle = `rgba(${PALETTE.DANGER_RGB}, ${0.35 + dangerFlash * 0.65})`;
  const lh = CONFIG.DANGER_LINE_H + dangerFlash * 3;
  ctx.fillRect(0, fieldH - lh, fieldW, lh);
}

/* ---- 次のキーのヒント: ロック中の隕石(なければ最下部)の期待入力を
   キーパッド上で光らせる。フリック方向は表示しない(隕石の文字を見て打たせる) ---- */
let lastHint = ""; // 行IDのキャッシュ(毎フレームのDOM操作を避ける)

function updateHint() {
  let token = null;
  if (settings.hint && game.started && !game.over && !game.paused) {
    let m = lockedTarget;
    if (!m) for (const c of meteors) if (!c || !m || c.y > m.y) m = c;
    if (m) token = expectedToken(m);
  }
  let row = null;
  if (token !== null) {
    for (const r of KEY_LAYOUT) {
      if (FLICK_MAP[r].includes(token)) { row = r; break; }
    }
  }
  const sig = row ?? "";
  if (sig === lastHint) return;
  lastHint = sig;
  for (const r of KEY_LAYOUT) keyEls[r].classList.remove("hint");
  if (row) keyEls[row].classList.add("hint");
}

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05); // タブ復帰時の暴走防止
  lastTime = now;
  update(dt);
  updateHint();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   フリック入力判定 (Pointer Events で統一。touchstart は使わない)
   pointerdown でキーを掴み、pointerup 時点の移動量で方向を確定
   ============================================================ */
const activePointers = new Map(); // pointerId → { key, x0, y0, guide }

/* 移動量 → 方向。atan2は使わず軸比較で四方向に落とす(斜めの取りこぼし防止) */
function dirFrom(dx, dy) {
  if (Math.max(Math.abs(dx), Math.abs(dy)) < CONFIG.FLICK_THRESHOLD) return DIR_CENTER;
  if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? DIR_LEFT : DIR_RIGHT;
  return dy < 0 ? DIR_UP : DIR_DOWN;
}

/* ---- フリックガイド: 押したキーの上に小さな十字で候補を出す ---- */
function makeGuide(row, rect) {
  const g = document.createElement("div");
  g.className = "guide";
  const cell = CONFIG.GUIDE_CELL;
  const step = cell + CONFIG.GUIDE_GAP;
  const size = cell + step * 2; // 十字全体の幅・高さ(3マス分)

  /* キー中央の真上に置き、画面端では内側にずらして見切れを防ぐ */
  let cx = rect.left + rect.width / 2;
  cx = Math.min(Math.max(cx, size / 2 + 4), window.innerWidth - size / 2 - 4);
  const originX = cx - size / 2;
  const originY = rect.top - CONFIG.GUIDE_LIFT - size;

  /* [中央, 左, 上, 右, 下] → 十字内の(列, 行) */
  const grid = [[1, 1], [0, 1], [1, 0], [2, 1], [1, 2]];
  g.cells = FLICK_MAP[row].map((kana, d) => {
    if (kana === null) return null;
    const c = document.createElement("div");
    const label = kana === MOD ? "小゛゜" : kana;
    c.className = "cell" + (label.length > 1 ? " sub" : "");
    c.textContent = label;
    c.style.left = originX + grid[d][0] * step + "px";
    c.style.top = originY + grid[d][1] * step + "px";
    c.style.width = cell + "px";
    c.style.height = cell + "px";
    g.appendChild(c);
    return c;
  });
  document.body.appendChild(g);
  return g;
}

function highlightGuide(g, dir) {
  for (const c of g.cells) c?.classList.remove("on");
  g.cells[dir]?.classList.add("on");
}

padEl.addEventListener("pointerdown", (e) => {
  SFX.ensure(); // AudioContextはユーザー操作の中でしか起こせない
  if (settings.bgm && game.started && !game.over) BGM.start(); // 初回タッチでBGM開始(再生中の呼び出しは何もしない)
  const key = e.target.closest(".key");
  if (!key) return;
  key.setPointerCapture(e.pointerId);
  let guide = null;
  if (settings.guide) {
    guide = makeGuide(key.dataset.row, key.getBoundingClientRect());
    highlightGuide(guide, DIR_CENTER);
  }
  activePointers.set(e.pointerId, { key, x0: e.clientX, y0: e.clientY, guide });
  key.classList.add("pressed");
});

padEl.addEventListener("pointermove", (e) => {
  const p = activePointers.get(e.pointerId);
  if (!p || !p.guide) return;
  highlightGuide(p.guide, dirFrom(e.clientX - p.x0, e.clientY - p.y0));
});

function releasePointer(e) {
  const p = activePointers.get(e.pointerId);
  if (!p) return null;
  activePointers.delete(e.pointerId);
  p.key.classList.remove("pressed");
  p.guide?.remove();
  return p;
}

padEl.addEventListener("pointerup", (e) => {
  const p = releasePointer(e);
  if (!p) return;
  const dir = dirFrom(e.clientX - p.x0, e.clientY - p.y0);
  const kana = FLICK_MAP[p.key.dataset.row][dir];
  if (kana === null) return; // 存在しない方向は無反応
  onInput(kana, dir);
});

padEl.addEventListener("pointercancel", releasePointer);

padEl.addEventListener("contextmenu", (e) => e.preventDefault());

/* ---- 確定入力をゲームへ渡す ---- */
const chipEl = document.getElementById("chip");

function onInput(kana, dir) {
  chipEl.classList.remove("miss");
  chipEl.textContent = `${kana === MOD ? "小゛゜" : kana}　${DIR_LABELS[dir]}`;
  const hit = handleGameInput(kana);
  if (hit !== null) recordInput(kana, dir, hit);
}
</script>
</body>

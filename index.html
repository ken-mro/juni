;'Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif&quot; font-weight='900' font-size='19' text-anchor='middle' dominant-baseline='central' fill='%23ffd93d' stroke='%231b1252' stroke-width='3' paint-order='stroke' stroke-linejoin='round'%3Eあ%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   調整用定数（レイアウト系）— CSSカスタムプロパティ
   ゲームプレイ系の数値は <script> 先頭の CONFIG にある
   ============================================================ */
:root {
  /* 縦配分: HUD(固定) + フィールド(残り全部) + キーパッド(固定) */
  --hud-h: 54px;              /* HUDの高さ */
  --pad-h: min(34dvh, 320px); /* キーパッド全体の高さ(親指の可動域に収める) */
  --pad-gap: 6px;             /* キー間の隙間 */
  --pad-pad: 8px;             /* キーパッド外周の余白 */
  --pad-side: clamp(24px, 9vw, 56px); /* キーパッド左右の空き(端のキーのフリック用) */
  --lv-h: 44px;               /* 開始レベル選択の1マスの高さ(番号+ベストタイムの2行) */
  --lv-gap: 6px;              /* 開始レベル選択のマス間の隙間 */
  --lv-rows: 2;               /* 開始レベル選択の表示段数(10個=2段。超えたぶんはスクロール) */
  --lv-scroll-gap: 12px;      /* スクロールバーが出るときにマスの右側へ空ける余白 */
  --logo-hud-h: 28px;         /* HUDのロゴ(2段のドット文字)の高さ */
  --logo-hud-h-narrow: 22px;  /* 狭い端末でのHUDロゴの高さ */
  --logo-title-w: min(100%, 250px); /* タイトル画面のロゴの幅 */
  --pixel-heading-h: 30px;    /* リザルト見出し(CLEAR! / TIME UP)のドット文字の高さ */
  --pixel-rank-h: 22px;       /* ランク文字(S/A/B/C)のドット文字の高さ */
  --pixel-rank-label-h: 11px; /* 「RANK」のドット文字の高さ */
  --pixel-rec-rank-h: 15px;   /* 記録一覧のランク文字の高さ */

  /* パレット: ビビッドな宇宙。深い紫の空に、黄・シアン・ピンクのネオンが差す */
  --bg-deep:    #1b1252;  /* 最深部の紫(体の背景) */
  --bg-field:   #3f2fae;  /* フィールド下端の明るい藍 */
  --panel:      #241b6e;  /* オーバーレイのパネル面 */
  --line:       #4238a6;  /* 区切り線・枡の枠 */
  --key-face:   #3a2f97;  /* キー面(上) */
  --key-face-2: #2c2378;  /* キー面(下) */
  --key-edge:   #6a5fd6;  /* キーの縁 */
  --key-shadow: #17104a;  /* キーの厚み */
  --text:       #ffffff;
  --dim:        #bdb8f2;  /* 非活性・補助テキスト(ラベンダー) */
  --ember:      #ffd93d;  /* 主アクセント: 星の黄。次に打つ文字・強調 */
  --cyan:       #4ff0e6;  /* 副アクセント: コンボ・ロック・ランク */
  --pink:       #ff6fb5;  /* 副アクセント: グラデーションの相方 */
  --danger:     #ff5c7a;  /* 警告(ラスト10秒・ミス・撃破数の減少) */
  --ok:         #7dffb0;  /* 改善(↑) */
  --logo-shadow: #17104a; /* ドット文字(ロゴ・見出し)の影(押し出し) */
  --logo-glow:   rgba(255, 111, 181, 0.45); /* タイトル画面のロゴの光彩 */

  --font-display: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; /* ランク・見出し用の明朝 */
  --font-ui: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100dvh;               /* 100vhはモバイルのアドレスバーで破綻する */
  overflow: hidden;
  touch-action: none;           /* 画面の引っ張り・ダブルタップズームを殺す */
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-ui);
}

#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---- HUD: 左=ロゴ+レベル / 中央=タイマー / 右=撃破(進行ゲージ)・コンボ ---- */
#hud {
  flex: none;
  height: calc(var(--hud-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 12px 0 14px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.hud-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ロゴ(SVGのドット文字)。中身は起動時に buildLogoSvg() が入れる */
#hud .wordmark { display: block; height: var(--logo-hud-h); }
.logo { display: block; height: 100%; width: auto; }
.logo .logo-shadow { fill: var(--logo-shadow); }
@media (max-width: 380px) {
  #hud .wordmark { height: var(--logo-hud-h-narrow); } /* 狭い端末ではロゴを小さく */
}
/* プレイ中のレベル(固定)を小さなピルで示す */
.lv-pill {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  padding: 2px 7px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.1);
  color: var(--ember);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#hud .label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--dim);
}
.hud-center { text-align: center; }
.hud-center .time {
  display: block;
  font-size: 30px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.hud-center .time.warn {
  color: var(--danger);
  animation: pulse 0.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
.hud-right {
  display: flex;
  justify-content: flex-end;
  gap: clamp(8px, 3vw, 18px);
  font-variant-numeric: tabular-nums;
}
#hud .stat { text-align: right; }
#hud .stat .value { display: block; font-size: 17px; line-height: 1.15; font-weight: 700; }
#hud .stat .value.combo { color: var(--cyan); }
.gauge {
  width: 64px;
  height: 4px;
  margin: 3px 0 0 auto;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.15);
  overflow: hidden;
}
.gauge i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--ember), var(--pink));
  transition: width 0.25s;
}

/* ---- フィールド (canvas) ---- */
#field {
  flex: 1 1 auto;
  min-height: 0;      /* flex子のcanvasがはみ出さないために必須 */
  position: relative;
}
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ---- キーパッド (DOM) ---- */
#pad {
  flex: none;
  height: calc(var(--pad-h) + env(safe-area-inset-bottom));
  padding: var(--pad-pad) calc(var(--pad-pad) + var(--pad-side))
           calc(var(--pad-pad) + env(safe-area-inset-bottom))
           calc(var(--pad-pad) + var(--pad-side));
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--pad-gap);
  background: linear-gradient(#22186a, var(--bg-deep));
  border-top: 1px solid var(--line);
}
.key {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(var(--key-face), var(--key-face-2));
  border: 1px solid var(--key-edge);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--key-shadow);
  font-family: var(--font-ui);
  font-size: clamp(20px, 3.6dvh, 28px);
  font-weight: 600;
  color: var(--text);
  touch-action: none;
}

/* 次に打つキーのヒント: キーが光る(フリック方向は示さない — 隕石を見て打たせる) */
.key.hint {
  border-color: var(--ember);
  box-shadow: 0 3px 0 var(--key-shadow), 0 0 16px rgba(255, 217, 61, 0.45);
}
.key.sub { font-size: clamp(14px, 2.4dvh, 19px); color: var(--dim); }
.key.pressed,
.key:active {
  background: var(--key-edge);
  border-color: var(--ember);
  box-shadow: none;
  transform: translateY(2px);
}

/* ---- フリックガイド (押下中に5方向の候補を表示) ---- */
.guide {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 10;
  pointer-events: none;
}
.guide .cell {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #5a4fd0;
  border: 1px solid #8a80ea;
  border-radius: 8px;
  font-size: 17px;
  color: var(--text);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
}
.guide .cell.sub { font-size: 10px; }
.guide .cell.on {
  background: var(--ember);
  border-color: var(--ember);
  color: var(--bg-deep);
}

/* ---- 入力チップ: 直前に確定した入力を小さく表示 ---- */
#chip {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--earth-h, 0px) + 6px); /* 地平線(canvas の地球。高さは CONFIG.EARTH_H が --earth-h に入れる)の上に載せる */
  font-size: 13px;
  letter-spacing: 0.15em;
  color: var(--dim);
  pointer-events: none;
  transition: color 0.3s;
}
#chip.miss { color: var(--danger); transition: none; }

/* ---- オーバーレイ共通(スタート・リザルト・一時停止・設定・記録・共有) ---- */
.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(27, 18, 82, 0.72);
}
.modal.hidden { display: none; }
/* 重なり順: タイトルの上にリザルト(記録の閲覧)、その上に記録一覧・共有画像が乗る。
   紙吹雪の canvas(#fx)はすべてのモーダルより上(記録更新の演出がリザルトに隠れないように) */
#overlay { z-index: 21; }
#records { z-index: 22; }
#share   { z-index: 23; }
#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 24;
  pointer-events: none;
}
.modal .panel {
  width: min(84vw, 350px);
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px 22px 20px;
  touch-action: pan-y; /* body の touch-action: none を上書きして縦スクロールを許す */
  background: var(--panel);
  border: 1px solid var(--key-edge);
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  text-align: center;
}
.go-title {
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: 0.3em;
  margin-bottom: 12px;
}
/* リザルトの見出しはドット文字(SVG)。中身は showResult() が入れる */
.go-title .pixel { height: var(--pixel-heading-h); margin: 0 auto; }
.pixel { display: block; width: auto; }
.pixel .logo-shadow { fill: var(--logo-shadow); }

/* リザルトの主役: クリアタイム(または 撃破/規定)を大きく */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin: 4px 0 10px;
}
.hero .label { font-size: 10px; letter-spacing: 0.25em; color: var(--dim); }
.hero .lv-big {
  font-size: 58px;
  font-weight: 800;
  line-height: 1;
  color: var(--ember);
  font-variant-numeric: tabular-nums;
}
.hero .lv-big small {
  font-size: 16px;
  letter-spacing: 0.1em;
  color: var(--dim);
  margin-left: 6px;
}
.hero.fail .lv-big { color: var(--text); }
.hero .rank {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  color: var(--cyan);
}
.hero .rank .rank-label { height: var(--pixel-rank-label-h); margin-bottom: 2px; }
.hero .rank .rank-letter { height: var(--pixel-rank-h); }
.hero .rank.hidden { display: none; }

.row {
  display: flex;
  justify-content: space-between;
  padding: 6px 2px;
  font-size: 14px;
  color: var(--dim);
  border-bottom: 1px solid var(--line);
}
.row b {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.row.hidden { display: none; }
.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 8px;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--ember), var(--pink));
  color: var(--bg-deep);
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
  vertical-align: 2px;
  /* 表示されるたびに弾む(display:none から出た瞬間に再生される。showResult() が毎回いったん hidden に戻す) */
  animation: badge-pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
}
.badge.hidden { display: none; }
@keyframes badge-pop {
  0%   { transform: scale(0); box-shadow: 0 0 0 0 var(--ember); }
  60%  { transform: scale(1.3); box-shadow: 0 0 18px 4px var(--ember); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; }
}
.sec-title {
  margin-top: 16px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--dim);
  border-bottom: 1px solid var(--line);
  padding-bottom: 5px;
}
.rowgrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  margin-top: 8px;
}
.rowgrid .cell,
.dircross .cell {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 7px;
  padding: 6px 0 5px;
  font-size: 11px;
  color: var(--dim);
}
.rowgrid .cell b,
.dircross .cell b {
  display: block;
  font-size: 13px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.cell.warn b { color: var(--ember); }
.cell.bad b { color: var(--danger); }
.cell.na b { color: var(--dim); }
i.up, i.down { font-style: normal; font-size: 10px; margin-left: 1px; }
i.up { color: var(--ok); }
i.down { color: var(--danger); }
.dircross {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  width: 72%;
  margin: 8px auto 0;
}
.dircross .blank { visibility: hidden; }

/* ---- 開始レベル選択(スタート画面) ---- */
.level-picker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--lv-gap);
  margin-top: 8px;
  /* 2段ぶんの高さに固定し、解放レベルが増えたら枠内でスクロールする */
  max-height: calc(var(--lv-h) * var(--lv-rows) + var(--lv-gap) * (var(--lv-rows) - 1));
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y; /* body の touch-action: none を上書きして縦スクロールを許す */
  scrollbar-width: thin;
  scrollbar-color: var(--key-edge) transparent;
}
/* 実際にスクロールするときだけ右に余白を取り、スクロールバーが番号に重ならないようにする */
.level-picker.scrolls { padding-right: var(--lv-scroll-gap); }
.lv {
  height: var(--lv-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.lv small {
  font-size: 9px;
  font-weight: 600;
  color: var(--ember);
  min-height: 11px; /* ベストタイムが無くても高さを揃える */
}
.lv.active {
  background: linear-gradient(135deg, var(--ember), var(--pink));
  border-color: transparent;
  color: var(--bg-deep);
}
.lv.active small { color: var(--bg-deep); opacity: 0.8; }
.lv.locked {
  color: rgba(255, 255, 255, 0.28);
  border-style: dashed;
  background: none;
  cursor: default;
}
.lv-desc {
  margin: 6px 2px 0;
  font-size: 11px;
  line-height: 1.7;
  color: var(--dim);
  min-height: 1.7em;
}
.best-line {
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--dim);
}
.best-line b { color: var(--ember); font-variant-numeric: tabular-nums; }

/* ---- クラウド同期(タイトル下部): ログイン導線とログイン中の表示。バックエンドが無ければ非表示 ---- */
.cloud {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--dim);
}
.cloud.hidden { display: none; }
.cloud .linklike { margin-top: 0; }
.cloud-user {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.cloud-user.hidden { display: none; }
.cloud-user b {
  display: inline-block;
  max-width: 11em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
  color: var(--text);
}
.cloud-status {
  display: block;
  margin-top: 4px;
  min-height: 1.4em;
  font-size: 11px;
  letter-spacing: 0.1em;
}

/* 引っ越しの案内(旧配信先で出す)と、引き継ぎ完了の知らせ(新ドメインで出す) */
.migrate {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--ember);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
  text-align: center;
}
.migrate.hidden { display: none; }
.migrate .primary { margin-top: 0; }
.migrate .primary.hidden { display: none; }
.migrate-lead { line-height: 1.5; }
.migrate-lead b { color: var(--ember); }
.migrate-lead:not(:empty) { margin-bottom: 8px; }
.migrate-note {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--dim);
}

/* ---- 記録一覧 ---- */
.records-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
  max-height: 50dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.rec {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}
.rec .rec-time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ember); }
.rec .rec-rank { color: var(--cyan); }
.rec .rec-rank .pixel { height: var(--pixel-rec-rank-h); }
.records-empty { margin: 14px 0 4px; font-size: 13px; color: var(--dim); }
.records-empty.hidden { display: none; }

/* ---- 共有画像のフォールバック表示 ---- */
#share-img {
  display: block;
  width: 100%;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.share-hint { margin-top: 8px; font-size: 11px; color: var(--dim); }

/* ---- ボタン ---- */
.primary {
  display: block;
  margin-top: 20px;
  width: 100%;
  padding: 13px 0;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--ember), var(--pink));
  color: var(--bg-deep);
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(255, 111, 181, 0.35);
  cursor: pointer;
}
.primary.hidden { display: none; }
.ghost {
  display: block;
  margin-top: 10px;
  width: 100%;
  padding: 10px 0;
  border: 1px solid var(--key-edge);
  border-radius: 10px;
  background: none;
  color: var(--dim);
  font-family: var(--font-ui);
  font-size: 14px;
  letter-spacing: 0.2em;
  cursor: pointer;
}
.ghost.hidden { display: none; }
/* 三次的な操作(設定・記録)は控えめなリンク風にする */
.linklike {
  margin-top: 12px;
  background: none;
  border: none;
  color: var(--dim);
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.15em;
  padding: 6px 10px;
  cursor: pointer;
}
.linklike:disabled { opacity: 0.4; cursor: default; }
.linklike.hidden { display: none; }
#btn-start { margin-top: 14px; } /* レベル選択の直下に置く */

/* ---- 設定・一時停止ボタン(フィールド右下) ---- */
#btn-settings,
#btn-pause {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(58, 47, 151, 0.7);
  border: 1px solid var(--key-edge);
  color: var(--dim);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#btn-pause { right: 60px; }

/* ---- スタート画面 ---- */
#start .start-title {
  display: flex;
  justify-content: center;
  margin-top: 4px;
}
#start .start-title .logo {
  width: var(--logo-title-w);
  height: auto;
  filter: drop-shadow(0 0 10px var(--logo-glow));
}
#start .start-copy {
  margin: 14px 0 2px;
  font-size: 13px;
  color: var(--text);
  letter-spacing: 0.05em;
}
#start .start-rules {
  text-align: left;
  font-size: 12px;
  color: var(--dim);
  line-height: 1.9;
  padding-left: 1.3em;
  margin: 8px 0 0;
}
.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  color: var(--text);
}
.toggle input {
  appearance: none;
  -webkit-appearance: none;
  width: 44px;
  height: 24px;
  border-radius: 12px;
  background: var(--line);
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
}
.toggle input:checked { background: var(--ember); }
.toggle input::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--text);
  transition: left 0.15s;
}
.toggle input:checked::after { left: 22px; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">

<!-- リザルト: クリア / 時間切れ / 記録の閲覧 の3モードで共用 -->

<div id="start" class="modal">

      <li>隕石のことばをフリックで撃つ</li>

    <button id="btn-start" class="primary">スタート</button>
    <button id="btn-records" class="linklike">🏆&#xFE0E; 記録を見る</button>
    <button id="btn-start-settings" class="linklike">⚙&#xFE0E; 設定</button>

    <div id="migrate" class="migrate hidden">

<div id="pause" class="modal hidden">

<div id="settings" class="modal hidden">

</div>

<!-- 記録: クリア済みレベルごとのベストタイム。タップで当時のプレー結果を表示 -->

<!-- 記録更新の紙吹雪。モーダルより上に重ねる全画面 canvas(操作は透過) -->
<canvas id="fx"></canvas>

<script>
"use strict";

/* ============================================================
   調整用定数（ゲームプレイ系）

   ============================================================ */
const CONFIG = {
  FLICK_THRESHOLD: 25,  // フリック方向確定の移動量しきい値(px)。未満は中央=あ段

  GUIDE_CELL: 34,       // フリックガイドの1マスの大きさ(px)
  GUIDE_GAP: 3,         // ガイドのマス間の隙間(px)
  GUIDE_LIFT: 10,       // ガイドをキー上端からどれだけ浮かせるか(px)

  /* 1プレイ = 1レベル。60秒以内に規定数を撃破すればクリア */
  TIME_LIMIT: 60,       // 制限時間(秒)
  LAST_SPURT: 10,       // 残りこの秒数からラストスパート演出(タイマー赤・秒カウント音・BGM加速)
  CLEAR_RATIO: 0.8,     // 規定撃破数 = 1分間の出現予定数(60秒÷出現間隔) × この係数

  FALL_SPEED: 30,       // 隕石の基本落下速度(px/秒)
  FALL_SPEED_VAR: 0.25, // 落下速度の個体差(±この割合)
  SPAWN_INTERVAL: 2.4,  // 隕石の出現間隔(秒)。規定撃破数の算出元でもある
  SPAWN_MIN_GAP: 0.45,  // 場が少ないときの補充でも最低これだけは間を置く(秒)
  METEOR_MIN: 2,        // 場に常に維持する隕石数(これ未満なら間隔を待たず補充)
  METEOR_MAX: 5,        // 同時に存在できる隕石の上限
  METEOR_FONT: 20,      // 隕石の文字サイズ(px)
  METEOR_RY: 26,        // 隕石の縦半径(px)。横半径は文字数から決まる
  HIT_PARTICLES: 8,     // 1文字消したときの破片の数
  BOOM_PARTICLES: 26,   // 破壊時の破片の数
  PARTICLE_GRAVITY: 120,// 破片に掛かる重力(px/秒²)
  METEOR_GLOW_BLUR: 18, // 隕石の縁の燃えるにじみ(px)
  LOCK_GLOW_BLUR: 24,   // ロック中の隕石のにじみ(少し強く光る)
  SHAKE_AMP: 6,         // 隕石着地時の画面揺れの振幅(px)
  SHAKE_DECAY: 18,      // 揺れの減衰速度(px/秒)
  SKY_LERP: 2.0,        // 空色の追従速度(1/秒)

  CONFETTI: 110,        // 紙吹雪の数(幅 400px あたり。広い画面では幅に応じて増える)

  START_LEVEL_SHOWN: 10,

  RANKS: [[30, "S"], [40, "A"], [50, "B"], [60, "C"]],

  SHARE_W: 1080,

  SHARE_LOGO_TOP: 64,  // 共有画像のロゴ上端(px)
  SHARE_HEAD_UNIT: 7,  // 共有画像の見出し(LEVEL n CLEAR)の1ドット(px)
  SHARE_HEAD_TOP: 316, // 共有画像の見出しの上端(px)
  SHARE_RANK_UNIT: 6,  // 共有画像の RANK の1ドット(px)
  SHARE_RANK_TOP: 636, // 共有画像の RANK の上端(px)
  SITE_URL: "flick-impact.com",

/* クラウド同期(Googleログイン)の接続先。同一オリジンの Worker(worker/index.js)が受ける。

  LOGIN_URL: "/auth/google/start",

/* canvas 描画色。CSSの :root パレットと合わせて調整する */
const PALETTE = {
  /* 空のグラデーション [上, 下]。レベルが上がるほど暖色へ。末尾以降は末尾で固定 */

    ["#161a66", "#3c5ad0"], // L2 藍
    ["#152470", "#2f86dc"], // L3 青
    ["#26145e", "#8a3ad0"], // L4 紫紅

  ],

  METEOR_BODY: "#4a3f9e",
  METEOR_EDGE: "#9a8ff0",
  METEOR_GLOW: "rgba(255, 111, 181, 0.6)",
  CRATER: "rgba(18, 12, 60, 0.5)",
  CRACK: "rgba(255, 217, 61, 0.85)",
  CHAR_NEXT: "#ffd93d",
  CHAR_REST: "#d6d5ff",
  CHAR_OUTLINE: "rgba(18, 12, 60, 0.85)",
  LOCK: "#4ff0e6",
  /* ロック中の隕石: 岩を少し明るく、縁とにじみを照準と同じシアンに */
  METEOR_BODY_LOCK: "#5b4fc4",
  METEOR_EDGE_LOCK: "#4ff0e6",
  METEOR_GLOW_LOCK: "rgba(79, 240, 230, 0.75)",
  /* 地球(favicon と同じ配色)とビーム */

/* 小゛゜による変換サイクル: 清音→濁音(→半濁音)→清音 / 清音→小文字→清音 */
const CYCLES = [
  "あぁ", "いぃ", "うぅ", "えぇ", "おぉ",
  "かが", "きぎ", "くぐ", "けげ", "こご",
  "さざ", "しじ", "すず", "せぜ", "そぞ",
  "ただ", "ちぢ", "つっづ", "てで", "とど",
  "はばぱ", "ひびぴ", "ふぶぷ", "へべぺ", "ほぼぽ",
  "やゃ", "ゆゅ", "よょ",
];
const CYCLE_NEXT = {};
const CHAR_CYCLE = {}; // 文字 → { cycle, i } (サイクル文字列と自分の位置)
for (const cycle of CYCLES) {
  for (let i = 0; i < cycle.length; i++) {
    CYCLE_NEXT[cycle[i]] = cycle[(i + 1) % cycle.length];
    CHAR_CYCLE[cycle[i]] = { cycle, i };
  }
}

/* 1文字を打つのに必要な入力列。例: が→[か,MOD] ぱ→[は,MOD,MOD] ね→[ね] */
function inputSeq(ch) {
  const c = CHAR_CYCLE[ch];
  return c ? [c.cycle[0], ...Array(c.i).fill(MOD)] : [ch];
}

/* ============================================================
   語彙モジュール: 正規化・難易度解析・バリデーション
   ============================================================ */
const DAKUTEN_BASE = {
  "が": "か", "ぎ": "き", "ぐ": "く", "げ": "け", "ご": "こ",
  "ざ": "さ", "じ": "し", "ず": "す", "ぜ": "せ", "ぞ": "そ",
  "だ": "た", "ぢ": "ち", "づ": "つ", "で": "て", "ど": "と",
  "ば": "は", "び": "ひ", "ぶ": "ふ", "べ": "へ", "ぼ": "ほ",
  "ゔ": "う",
};
const HANDAKUTEN_BASE = {
  "ぱ": "は", "ぴ": "ひ", "ぷ": "ふ", "ぺ": "へ", "ぽ": "ほ",
};
const SMALL_BASE = {
  "ぁ": "あ", "ぃ": "い", "ぅ": "う", "ぇ": "え", "ぉ": "お",
  "っ": "つ", "ゃ": "や", "ゅ": "ゆ", "ょ": "よ", "ゎ": "わ",
};

/* 単語には使えないが入力は可能な記号(かな→行の表から除外する) */
const NON_WORD_CHARS = new Set([..."「」、。？！"]);

/* かな(清音・ー) → 所属するキー行。FLICK_MAP から導出 */
const KANA_ROW = {};
for (const row of KEY_LAYOUT) {
  for (const kana of FLICK_MAP[row]) {
    if (kana && kana !== MOD && !NON_WORD_CHARS.has(kana)) KANA_ROW[kana] = row;
  }
}

/* が→か、ぱ→は、ゃ→や の正規化 */
function toBase(ch) {
  return DAKUTEN_BASE[ch] ?? HANDAKUTEN_BASE[ch] ?? SMALL_BASE[ch] ?? ch;
}

/* 所属する行("か" など)。かなでなければ null */
function rowOf(base) {
  return KANA_ROW[base] ?? null;
}

/* 清音0、濁音1、半濁音2、小文字1 の追加アクション数 */
function extraCost(ch) {
  if (ch in DAKUTEN_BASE) return COST.dakuten;
  if (ch in HANDAKUTEN_BASE) return COST.handakuten;
  if (ch in SMALL_BASE) return COST.small;
  return 0;
}

/* 濁音/半濁音/小文字/長音のビットフラグ */
const FLAG = { DAKUTEN: 1, HANDAKUTEN: 2, SMALL: 4, CHOUON: 8 };

/* 読み → { actions, rows, flags, len }
   actions = 実際のフリック回数の合計。難易度の基準はこの値(文字数ではない) */
function analyze(kana) {
  let actions = 0;
  let flags = 0;
  const rows = new Set();
  for (const ch of kana) {
    rows.add(rowOf(toBase(ch)));
    actions += 1 + extraCost(ch);
    if (ch in DAKUTEN_BASE) flags |= FLAG.DAKUTEN;
    if (ch in HANDAKUTEN_BASE) flags |= FLAG.HANDAKUTEN;
    if (ch in SMALL_BASE) flags |= FLAG.SMALL;
    if (ch === "ー") flags |= FLAG.CHOUON;
  }
  return { actions, rows: [...rows], flags, len: [...kana].length };
}

/* 読みの検査。問題なければ null、あれば理由を返す */
function validateReading(reading) {
  if (!reading) return "空文字";
  if (/[ァ-ヺ]/.test(reading)) return "カタカナを含む";
  if (/[一-鿿々]/.test(reading)) return "漢字を含む";
  if (reading.includes(" ")) return "半角スペースを含む";
  if ([...reading].length > CONFIG.METEOR_MAX_LEN) return `${CONFIG.METEOR_MAX_LEN}文字を超える`;
  const first = [...reading][0];
  if (first in SMALL_BASE || first === "ー" || first === "ん" || first === "を") return `語頭に「${first}」`;
  for (const ch of reading) {
    if (rowOf(toBase(ch)) === null) return `想定外の文字「${ch}」`;
  }
  return null;
}

/* 起動時に全単語を検査・解析。問題のある語は警告してスキップ。
   first = 先頭のひらがな(が と か は別)、firstToken = 先頭の入力トークン(場内重複の判定用) */
const LEXICON = [];
const seenReadings = new Set();
for (const raw of WORDS) {
  const parts = raw.split("|");
  const reason = parts.length > 2 ? "「|」が2つ以上ある"
    : seenReadings.has(parts[0]) ? "読みが重複"
    : validateReading(parts[0]);
  if (reason) {
    console.warn(`単語をスキップ: "${raw}" — ${reason}`);
    continue;
  }
  seenReadings.add(parts[0]);
  const first = [...parts[0]][0];
  LEXICON.push({
    reading: parts[0], display: parts[1] ?? null,
    first, firstToken: inputSeq(first)[0],
    ...analyze(parts[0]),
  });
}
console.log(`[語彙] ${LEXICON.length}/${WORDS.length} 語を読み込み`);

/* かなの網羅チェック(メンテナンス用): 一度も出ないかな、語頭に立たない清音を報告 */
{
  const used = new Set(LEXICON.flatMap((w) => [...w.reading]));
  const firsts = new Set(LEXICON.map((w) => w.first));
  const allKana = [
    ...Object.keys(KANA_ROW), ...Object.keys(DAKUTEN_BASE),
    ...Object.keys(HANDAKUTEN_BASE), ...Object.keys(SMALL_BASE),
  ];
  const unused = allKana.filter((k) => !used.has(k));
  const noFirst = Object.keys(KANA_ROW).filter((k) => !["ん", "を", "ー"].includes(k) && !firsts.has(k));
  console.info(`[語彙] 未出現のかな: ${unused.join("") || "なし"} / 語頭に立たない清音: ${noFirst.join("") || "なし"}`);
}

/* ============================================================
   レベル定義: 解放される行と許可フラグ
   長音(ー)はわ行の解放と同時に出るため常に許可
   ============================================================ */
const ALL_ROWS = ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ"];
const LEVELS = [
  { rows: ["あ", "か", "さ"], flags: FLAG.CHOUON, label: "あ・か・さ" },
  { rows: ["あ", "か", "さ", "た", "な", "は"], flags: FLAG.CHOUON, label: "＋た・な・は" },
  { rows: ALL_ROWS, flags: FLAG.CHOUON, label: "＋ま・や・ら・わ" },
  { rows: ALL_ROWS, flags: FLAG.CHOUON | FLAG.DAKUTEN | FLAG.HANDAKUTEN, label: "濁音・半濁音" },
  { rows: ALL_ROWS, flags: FLAG.CHOUON | FLAG.DAKUTEN | FLAG.HANDAKUTEN | FLAG.SMALL, label: "小文字・拗音" },
];
/* レベルの見出し。LEVELS を超えたら速度だけが上がる */
function levelLabel(level) {
  return level <= LEVELS.length ? LEVELS[level - 1].label : "全字種・スピードアップ";
}

/* そのレベルの読みの文字数 [最小, 最大]。LEVEL_LEN を超えたら末尾で固定 */
function lenRange(level) {
  return CONFIG.LEVEL_LEN[Math.min(level, CONFIG.LEVEL_LEN.length) - 1];
}

/* レベルごとの出題プールを起動時に確定しておく。字種(LEVELS)と文字数(LEVEL_LEN)の両方で絞る。
   どちらも末尾以降は固定なので、プールは長いほうの定義の数だけ作れば足りる */
const POOL_LEVELS = Math.max(LEVELS.length, CONFIG.LEVEL_LEN.length);
const poolIndex = (level) => Math.min(level, POOL_LEVELS) - 1;
const LEVEL_POOLS = Array.from({ length: POOL_LEVELS }, (_, i) => {
  const def = LEVELS[Math.min(i, LEVELS.length - 1)];
  const [lo, hi] = lenRange(i + 1);
  return LEXICON.filter((w) =>
    w.rows.every((r) => def.rows.includes(r)) && (w.flags & ~def.flags) === 0 &&
    w.len >= lo && w.len <= hi);
});
/* レベルごとに「直近何語の語頭を避けるか」。語頭の種類が少ないプール(L1は15種)では
   種類数 − SLACK まで自動で下げる(下げないと候補が尽きて規則が無意味になる) */
const LEVEL_FIRST_LIMIT = LEVEL_POOLS.map((p) => {
  const distinct = new Set(p.map((w) => w.first)).size;
  return Math.max(1, Math.min(CONFIG.RECENT_FIRST_KANA, distinct - CONFIG.FIRST_KANA_SLACK));
});
console.log(`[語彙] レベル別プール: ${LEVEL_POOLS.map((p) => p.length).join(" / ")}` +
  ` / 語頭回避数: ${LEVEL_FIRST_LIMIT.join(" / ")}`);

/* ---- 難易度スケール。L1〜L5はテーブル、L6以降はレベルに比例して伸び続ける ---- */
function speedScale(level) {
  if (level <= 5) return CONFIG.LEVEL_SPEED[level - 1];
  return CONFIG.LEVEL_SPEED[4] * (1 + (level - 5) * CONFIG.ENDLESS_SPEED_PER_LEVEL);
}
function spawnScale(level) {
  if (level <= 5) return CONFIG.LEVEL_SPAWN[level - 1];
  return Math.max(
    CONFIG.LEVEL_SPAWN[4] * (1 - (level - 5) * CONFIG.ENDLESS_SPAWN_PER_LEVEL),
    0.01);
}
/* そのレベルの出現間隔(秒)。下限あり */
function spawnIntervalFor(level) {
  return Math.max(CONFIG.SPAWN_INTERVAL * spawnScale(level), CONFIG.SPAWN_INTERVAL_MIN);
}
/* そのレベルの規定撃破数 = 1分間の出現予定数 × CLEAR_RATIO */
function requiredKills(level) {
  return Math.max(1, Math.round(CONFIG.TIME_LIMIT / spawnIntervalFor(level) * CONFIG.CLEAR_RATIO));
}
/* クリアタイム(秒) → ランク文字。しきい値を超えたら末尾 */
function rankFor(time) {
  return (CONFIG.RANKS.find(([max]) => time <= max) ?? CONFIG.RANKS.at(-1))[1];
}

function hexToRgb(hex) {

}

/* ============================================================
   ドット文字: PIXEL_FONT から文字列(複数行可)のドット配置を作り、SVG / canvas に描く
   ロゴ(LOGO)もリザルトの見出しもこれで描く
   ============================================================ */
const GLYPH_H = 7;
/* 各行を中央揃えで並べ、横方向に連続するドットをまとめた矩形 [x, y, 幅](単位: ドット)を返す */
function pixelRuns(lines, gap = LOGO.GAP, lineGap = LOGO.LINE_GAP) {
  const glyph = (ch) => PIXEL_FONT[ch] || PIXEL_FONT[" "];
  const widths = lines.map((line) => [...line].reduce((a, ch) => a + glyph(ch)[0].length + gap, -gap));
  const w = Math.max(...widths);
  const h = lines.length * (GLYPH_H + lineGap) - lineGap;
  const runs = [];
  lines.forEach((line, li) => {
    const y0 = li * (GLYPH_H + lineGap);
    const rows = Array.from({ length: GLYPH_H }, () => []);
    let x0 = Math.floor((w - widths[li]) / 2);
    for (const ch of line) {
      glyph(ch).forEach((bits, y) => [...bits].forEach((b, x) => { if (b === "1") rows[y].push(x0 + x); }));
      x0 += glyph(ch)[0].length + gap;
    }
    rows.forEach((xs, y) => {
      for (let i = 0; i < xs.length; i++) {
        let len = 1;
        while (i + 1 < xs.length && xs[i + 1] === xs[i] + len) len++;
        runs.push([xs[i], y0 + y, len]);
        i += len - 1;
      }
    });
  });
  return { w, h, runs };
}
let pixelSeq = 0;
/* DOM 用: 影付きの SVG 文字列。fill は CSS変数名の配列(左→右のグラデーション)か "currentColor" */
function buildPixelSvg(lines, fill, className = "pixel") {
  const { w, h, runs } = pixelRuns(lines);
  const d = runs.map(([x, y, len]) => `M${x} ${y}h${len}v1h-${len}z`).join("");
  const s = LOGO.SHADOW;
  let defs = "", face = fill;
  if (Array.isArray(fill)) {
    const id = `pixel-grad-${++pixelSeq}`;
    const stops = fill.map((v, i) => `<stop offset="${fill.length > 1 ? i / (fill.length - 1) : 0}" style="stop-color:var(${v})"/>`).join("");
    defs = `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${w}" y2="0">${stops}</linearGradient></defs>`;
    face = `url(#${id})`;
  }
  return `<svg class="${className}" viewBox="0 0 ${w + s} ${h + s}" role="img" aria-label="${lines.join(" ")}" shape-rendering="crispEdges">` +
    `${defs}<path class="logo-shadow" transform="translate(${s} ${s})" d="${d}"/><path fill="${face}" d="${d}"/></svg>`;
}
const buildLogoSvg = () => buildPixelSvg(LOGO.LINES, LOGO.GRADIENT, "pixel logo");
/* canvas 用: 中心 cx・上端 top に 1ドット unit px で描く。colors は色の配列(左→右のグラデーション) */
function drawPixelText(g, lines, cx, top, unit, colors, shadowColor = PALETTE.SHARE_LOGO_SHADOW) {
  const { w, runs } = pixelRuns(lines);
  const x0 = cx - (w * unit) / 2;
  const s = LOGO.SHADOW * unit;
  const paint = (dx, dy) => { for (const [x, y, len] of runs) g.fillRect(x0 + x * unit + dx, top + y * unit + dy, len * unit, unit); };
  g.fillStyle = shadowColor;
  paint(s, s);
  const grad = g.createLinearGradient(x0, 0, x0 + w * unit, 0);
  colors.forEach((c, i) => grad.addColorStop(colors.length > 1 ? i / (colors.length - 1) : 0, c));
  g.fillStyle = grad;
  paint(0, 0);
}

/* ============================================================
   隕石: 生成・落下・ターゲティング・破壊
   ============================================================ */
const METEOR_FONT_STR = `bold ${CONFIG.METEOR_FONT}px "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif`;
const CHAR_ADVANCE = CONFIG.METEOR_FONT * 1.15; // 1文字ぶんの送り幅

let meteors = [];
let particles = [];
let beams = [];    // 地球から隕石へ撃ったビーム(短く残って消える)
let confetti = []; // 記録更新の紙吹雪(ウィンドウ座標。#fx canvas に描く)

let dangerFlash = 0;
let shake = 0; // 画面揺れの残り振幅(px)

let recentWords = []; // 直近に出題した読み(同じ語の再出題の回避用)
let recentFirst = []; // 直近に出題した語の先頭ひらがな(語頭の連続重複禁止)

/* 現在レベルのプールから単語を選ぶ。条件を段階的に緩めて候補を絞り、一様に選ぶ:
   1. 語頭が直近に出ていない ∧ 先頭トークンが場の隕石と重複しない ∧ 同じ語が直近に出ていない
   2. 同じ語の条件を外す
   3. 語頭の条件も外す(場内重複のみ回避 — ターゲティングの前提なので最後まで残す)
   4. 完全ランダム */
const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
function pickWord(pool) {
  const onField = new Set(meteors.map(expectedToken));
  const notOnField = (w) => !onField.has(w.firstToken);
  const freshFirst = (w) => !recentFirst.includes(w.first);
  const freshWord = (w) => !recentWords.includes(w.reading);
  const tiers = [
    pool.filter((w) => notOnField(w) && freshFirst(w) && freshWord(w)),
    pool.filter((w) => notOnField(w) && freshFirst(w)),
    pool.filter(notOnField),
    pool,
  ];
  return pickRandom(tiers.find((t) => t.length > 0));
}

function spawnMeteor() {
  const poolIdx = poolIndex(game.level);
  const word = pickWord(LEVEL_POOLS[poolIdx]);
  recentWords.push(word.reading);
  recentWords = recentWords.slice(-CONFIG.RECENT_WORDS);
  recentFirst.push(word.first);
  recentFirst = recentFirst.slice(-LEVEL_FIRST_LIMIT[poolIdx]);
  const chars = [...word.reading].map((ch) => ({ ch, tokens: inputSeq(ch) }));
  const rx = Math.max((word.len * CHAR_ADVANCE) / 2 + 14, 40);
  const ry = CONFIG.METEOR_RY + word.len * 1.5;
  const margin = rx + 8;
  const speedJitter = 1 + (Math.random() * 2 - 1) * CONFIG.FALL_SPEED_VAR;
  meteors.push({
    word, chars,
    charIdx: 0,   // 何文字目まで消したか
    charProg: 0,  // 現在の文字に入力済みのトークン数
    x: margin + Math.random() * Math.max(fieldW - margin * 2, 1),
    y: ry + 6, // 画面上部に全体が見える位置から落ち始める

    rx, ry,
    speed: CONFIG.FALL_SPEED * speedScale(game.level) * speedJitter,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() * 2 - 1) * 0.3,
    /* 岩の輪郭(半径ジッタ)と、ヒビ・クレーターの乱数は生成時に固定 */
    shape: Array.from({ length: 11 }, () => 0.82 + Math.random() * 0.36),
    seeds: Array.from({ length: 8 }, () => Math.random()),
  });
}

/* いま消しかけの文字の表示形。か→(MOD)→が の途中経過を見せる */
function displayChar(m, i) {
  const ch = m.chars[i].ch;
  if (i !== m.charIdx || m.charProg === 0) return ch;
  return CHAR_CYCLE[ch].cycle[m.charProg - 1];
}

function expectedToken(m) {
  return m.chars[m.charIdx].tokens[m.charProg];
}

const pickColor = () => PALETTE.PARTICLES[Math.floor(Math.random() * PALETTE.PARTICLES.length)];

function spawnParticles(x, y, n) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 140;
    particles.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 30,
      life: 0.5 + Math.random() * 0.4,
      t: 0,
      r: 1.5 + Math.random() * 2.5,
      color: pickColor(),
    });
  }
}

/* 記録更新: ウィンドウの上端から紙吹雪を降らせる(リザルトの上に重なる #fx canvas に描く)。
   n は幅 400px あたりの数で、広い画面ではそのぶん増やす */
function spawnConfetti(n) {
  const w = window.innerWidth;
  const count = Math.round(n * Math.min(3, Math.max(1, w / 400)));
  for (let i = 0; i < count; i++) {
    confetti.push({
      x: Math.random() * w, y: -10 - Math.random() * 80,
      vx: (Math.random() - 0.5) * 70, vy: 30 + Math.random() * 80,
      w: 4 + Math.random() * 4, h: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 8,
      life: CONFIG.CONFETTI_LIFE * (0.7 + Math.random() * 0.6), t: 0,
      color: pickColor(),
    });
  }
}

/* 発射口: 地球(地平線)の頂点 */
const muzzleX = () => fieldW / 2;
const muzzleY = () => fieldH - CONFIG.EARTH_H;

/* 地球から隕石へビームを撃つ。着弾点は撃った瞬間の座標で固定する(撃破時は隕石が
   もう配列に無いので追従できない。落下は遅く、残留中の移動は数px)。
   通常の一撃は文字を横切らないよう発射口側の岩の縁に、撃破の一撃は中心に当てる */
function fireBeam(m, boom) {
  const x0 = muzzleX();
  const y0 = muzzleY();
  let x1 = m.x;
  let y1 = m.y;
  if (!boom) {
    const ang = Math.atan2(y0 - m.y, x0 - m.x);
    x1 += Math.cos(ang) * m.rx * 0.85;
    y1 += Math.sin(ang) * m.ry * 0.85;
  }
  beams.push({ x0, y0, x1, y1, t: 0, life: CONFIG.BEAM_LIFE, boom });
}

/* midiノート番号 → 周波数(69 = A4 = 440Hz)。効果音とBGMで共用 */
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* ============================================================
   効果音: Web Audio APIによる合成音(外部ファイルなし)
   モバイルの制約により、最初のタッチで AudioContext を起こす
   ============================================================ */
const SFX = (() => {
  let ctx = null;
  let master = null;
  let muted = false;

  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : CONFIG.SOUND_VOLUME;
      master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  function tone(freq, dur, { type = "sine", vol = 0.3, slide = 0, delay = 0 } = {}) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(freq + slide, 30), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g).connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function noise(dur, { vol = 0.4, freq = 800, delay = 0 } = {}) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const len = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(freq, t0);
    filter.frequency.exponentialRampToValueAtTime(100, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(filter).connect(g).connect(master);
    src.start(t0);
  }

  /* 一連のメロディ(midi配列)を等間隔で鳴らす */
  function melody(notes, step, dur, opts) {
    notes.forEach((m, i) => tone(midiHz(m), dur, { ...opts, delay: (opts.delay ?? 0) + i * step }));
  }

  const MAJOR = [0, 2, 4, 5, 7, 9, 11]; // 長音階の度数(コンボで登る)

  return {
    ensure,
    state: () => ctx?.state ?? "none",
    /* BGMとAudioContextを共有するための参照(二重生成の回避) */
    context: () => ctx,
    /* 効果音のミュート(BGMには影響しない) */
    setMuted(m) {
      muted = m;
      if (master) master.gain.value = m ? 0 : CONFIG.SOUND_VOLUME;
    },
    /* 正解入力。コンボが乗るほど長音階を1音ずつ登る(2オクターブで頭打ち) */
    tick(combo) {
      const i = Math.min(combo, 14);
      tone(midiHz(72 + MAJOR[i % 7] + 12 * Math.floor(i / 7)), 0.07, { type: "triangle", vol: 0.18 });
    },
    /* 1文字削れた(ヒビ) */
    crack() { noise(0.07, { vol: 0.12, freq: 3000 }); tone(520, 0.08, { type: "square", vol: 0.1, slide: 200 }); },
    /* 隕石破壊: 低い衝撃 + 上昇するチャイム */
    boom() {
      noise(0.3, { vol: 0.4, freq: 1400 });
      tone(110, 0.3, { vol: 0.45, slide: -60 });
      melody([79, 84], 0.06, 0.12, { type: "square", vol: 0.1, delay: 0.02 });
    },
    /* ミス入力: 短く低いブザー */
    miss() { tone(180, 0.14, { type: "square", vol: 0.18, slide: -60 }); },
    /* 隕石着地(撃破数−1): 落ちる2音。警報にはしない */
    land() {
      tone(320, 0.22, { vol: 0.4, slide: -200 });
      tone(240, 0.2, { type: "triangle", vol: 0.2, slide: -120, delay: 0.1 });
      noise(0.16, { vol: 0.25, freq: 900 });
    },
    /* コンボ節目: 高い完全五度の2音 */
    comboMilestone() {
      melody([88, 95], 0.07, 0.18, { type: "square", vol: 0.12 });
    },
    /* ラストスパートの秒カウント */
    timeTick() { tone(1320, 0.05, { type: "triangle", vol: 0.16 }); },
    /* クリア: 上昇して終わる明るいファンファーレ */
    clear() {
      melody([67, 72, 76, 79], 0.12, 0.3, { type: "triangle", vol: 0.28, delay: 0.15 });
      [72, 76, 79, 84].forEach((m) => tone(midiHz(m), 0.9, { type: "triangle", vol: 0.12, delay: 0.65 }));
    },
    /* 時間切れ(未クリア): 控えめに下がる2音 */
    fail() {
      melody([67, 62], 0.28, 0.4, { type: "triangle", vol: 0.22, delay: 0.15 });
    },
    /* 記録更新: 駆け上がるきらめき */
    newRecord() {
      melody([79, 81, 83, 84, 86, 88, 91], 0.05, 0.25, { type: "triangle", vol: 0.14, delay: 1.4 });
    },
  };
})();

/* ============================================================
   BGM: Web Audio APIによるチップチューン(音源ファイルなし・手続き生成)
   構成: 25%パルス波のリード + 三角波ベース(オクターブ跳躍)
       + 16分で回る矩形波のチップコード + ノイズ打楽器(キック/スネア/ハット)
   setTimeoutのドリフトを避けるため、AudioContextのcurrentTimeを
   基準にした先読みスケジューラで正確な時刻に発音を予約する。
   AudioContextはSFXと共有し、二重生成しない。
   ============================================================ */
const BGM = (() => {
  /* --- 曲定義: Cメジャー 8小節の王道進行を2周(16小節)。
     C | G | Am | F | C | G | F | G  midiノート番号で記述 --- */
  const CHORDS = [
    { bass: 36, tones: [60, 64, 67] }, // C
    { bass: 43, tones: [59, 62, 67] }, // G
    { bass: 45, tones: [60, 64, 69] }, // Am
    { bass: 41, tones: [60, 65, 69] }, // F
    { bass: 36, tones: [60, 64, 67] }, // C
    { bass: 43, tones: [59, 62, 67] }, // G
    { bass: 41, tones: [60, 65, 69] }, // F
    { bass: 43, tones: [59, 62, 67] }, // G
  ];
  /* リード: 1小節=8分×8。数値=発音、"-"=前の音を伸ばす、null=休符 */
  const MELODY = [
    [76, 76, 79, "-", 76, 74, 72, "-"],
    [74, 74, 79, "-", 74, 72, 71, "-"],
    [72, 72, 76, "-", 81, 79, 76, "-"],
    [77, 76, 74, 76, 77, "-", 79, "-"],
    [79, "-", 76, 72, 76, 79, 84, "-"],
    [83, "-", 79, 74, 79, 83, 86, "-"],
    [84, 81, 77, 81, 84, "-", 81, 79],
    [79, "-", 83, "-", 84, "-", "-", null],
    [76, 76, 79, "-", 76, 74, 72, "-"],
    [74, 74, 79, "-", 74, 72, 71, "-"],
    [72, 72, 76, "-", 81, 79, 76, "-"],
    [77, 76, 74, 76, 77, "-", 79, "-"],
    [84, 83, 81, 79, 76, "-", 79, "-"],
    [83, 81, 79, 77, 74, "-", 79, "-"],
    [77, 79, 81, 84, 81, 79, 77, 76],
    [74, "-", 76, "-", 72, "-", "-", null],
  ];
  const BASS_OCT = [0, 0, 12, 0, 0, 12, 0, 12]; // ベース: 8分ごとのオクターブ跳躍
  const PULSE_DUTY = 0.25;  // リードのパルス幅(25% = 定番のチップ音)
  const LOOKAHEAD = 1.2;    // 何秒先まで発音を予約するか
  const TICK_MS = 250;      // スケジューラの起床間隔(ms)。精度には影響しない

  let ac = null;        // SFXと共有するAudioContext
  let bus = null;       // BGM全体のゲイン(フェードイン/アウト用)
  let delaySend = null; // リードの残響(ディレイ)への送り口
  let leadOut = null;   // リードの出力(ローパス→bus、少量を残響へ)
  let pulseWave = null; // 25%パルス波(PeriodicWave)。一度作れば使い回す
  let noiseBuf = null;  // ハット/スネア用の共有ノイズバッファ(毎回作らない)
  let timer = null;
  let running = false;
  let barIdx = 0;
  let nextBarTime = 0;

  /* レベル追従: 高レベルほど速く・リズムが密に。ラストスパートでさらに加速。
     値は小節の境界でしか反映されないため急変しない */
  function mood() {
    const lv = Math.min(game.level, CONFIG.BGM_LEVEL_CAP) - 1;
    const bpm = CONFIG.BGM_BPM + lv * CONFIG.BGM_BPM_PER_LEVEL +
      (game.spurt ? CONFIG.BGM_SPURT_BPM_ADD : 0);
    return {
      spb: 60 / bpm,                // 1拍の秒数
      drive: Math.min(lv / 6, 1),   // 追加キック/16分ハットの音量係数(0→1)
    };
  }

  /* BGMの出力バスと残響を組み立てる。開始のたびに作り直し、
     停止時に切り離すことで前回セッションの鳴り残りを持ち込まない */
  function buildGraph() {
    bus = ac.createGain();
    bus.gain.value = 0.0001;
    bus.connect(ac.destination);
    const delay = ac.createDelay(1.0);
    delay.delayTime.value = 0.34; // 付点8分相当。テンポ変化に合わせ毎小節微調整
    const damp = ac.createBiquadFilter();
    damp.type = "lowpass";
    damp.frequency.value = 2600; // 繰り返すほど残響が丸くなる
    const fb = ac.createGain();
    fb.gain.value = 0.28;        // 残響のフィードバック量
    const wet = ac.createGain();
    wet.gain.value = 0.35;       // 残響の返し量
    delay.connect(damp);
    damp.connect(fb).connect(delay); // フィードバックループ
    delay.connect(wet).connect(bus);
    delaySend = delay;
    /* リード: 高域を少し丸めてから出す。残響へは控えめに送る */
    leadOut = ac.createBiquadFilter();
    leadOut.type = "lowpass";
    leadOut.frequency.value = 5200;
    leadOut.connect(bus);
    const send = ac.createGain();
    send.gain.value = 0.3;
    leadOut.connect(send).connect(delaySend);
    if (!pulseWave) {
      /* 矩形波の各倍音を sin(nπd) で重み付けするとパルス幅 d の波になる */
      const N = 32;
      const real = new Float32Array(N);
      const imag = new Float32Array(N);
      for (let n = 1; n < N; n++) imag[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * PULSE_DUTY);
      pulseWave = ac.createPeriodicWave(real, imag);
    }
    if (!noiseBuf) {
      const len = Math.ceil(ac.sampleRate * 0.25);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
  }

  /* --- 音色: いずれも短命ノードの使い捨て(stop予約済みなのでGCされる) --- */

  /* キック: 正弦波のピッチを一気に落とす定番の合成 */
  function kick(t, vol) {
    if (vol < 0.01) return; // 音量ゼロ相当はノード自体を作らない(低レベル時の省負荷)
    const osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(48, t + 0.09);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    osc.connect(g).connect(bus);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  /* ノイズ打楽器: ハット(高域・極短)とスネア(中域・短)を兼ねる */
  function noiseHit(t, vol, freq, dur, type) {
    if (vol < 0.01) return;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(bus);
    src.start(t, Math.random() * 0.1); // 再生開始位置をずらし同一音の繰返し感を消す
    src.stop(t + dur + 0.02);
  }

  /* ベース: 三角波の短い1音(丸くて跳ねる) */
  function bassNote(t, freq, dur) {
    const osc = ac.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(bus);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* チップコード: 矩形波の極短音。3声を16分で回して和音に聞かせる */
  function chordNote(t, freq, dur, lp) {
    const osc = ac.createOscillator();
    osc.type = "square";
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.028, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(lp);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* リード: 25%パルス波。素早く立ち上がり、少し減衰して保持する */
  function leadNote(t, freq, dur) {
    const osc = ac.createOscillator();
    osc.setPeriodicWave(pulseWave);
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.1, t + 0.07);
    g.gain.setValueAtTime(0.1, t + Math.max(dur - 0.03, 0.08));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(leadOut);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* 1小節(4拍)ぶんをまとめて t0 から予約する。小節の長さ(秒)を返す */
  function scheduleBar(t0) {
    const { spb, drive } = mood();
    const e8 = spb / 2;  // 8分音符の長さ(秒)
    const e16 = spb / 4; // 16分音符の長さ(秒)
    const chord = CHORDS[barIdx % CHORDS.length];
    const mel = MELODY[barIdx];
    const isTurn = barIdx === MELODY.length - 1; // ループの折り返し小節
    barIdx = (barIdx + 1) % MELODY.length;

    /* 残響の長さをテンポに追従させる(付点8分) */
    delaySend.delayTime.setTargetAtTime(spb * 0.75, t0, 0.5);

    /* リード: "-" が続くぶん音を伸ばす */
    for (let i = 0; i < 8; i++) {
      const n = mel[i];
      if (typeof n !== "number") continue;
      let len = 1;
      while (i + len < 8 && mel[i + len] === "-") len++;
      leadNote(t0 + i * e8, midiHz(n), e8 * len - 0.02);
    }

    /* チップコード: 16分で3声を回す(ローパスで角を取る) */
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 2400;
    lp.connect(bus);
    for (let i = 0; i < 16; i++) {
      chordNote(t0 + i * e16, midiHz(chord.tones[i % 3]), e16 * 0.9, lp);
    }

    /* ベース: 8分刻みのオクターブ跳躍が推進力を作る */
    for (let i = 0; i < 8; i++) {
      bassNote(t0 + i * e8, midiHz(chord.bass + BASS_OCT[i]), e8 * 0.9);
    }

    /* ドラム: キックは1・3拍(レベルが上がると2・4拍が加わり四つ打ちへ)、
       スネアは2・4拍、ハットは8分裏(レベルが上がると16分が加わる) */
    for (let b = 0; b < 4; b++) {
      const t = t0 + b * spb;
      kick(t, b % 2 === 0 ? 0.42 : 0.42 * drive);
      if (b % 2 === 1) noiseHit(t, 0.1, 1800, 0.12, "bandpass");        // スネア
      noiseHit(t + spb * 0.5, 0.045, 6500, 0.04, "highpass");           // 8分裏ハット
      noiseHit(t + spb * 0.25, 0.03 * drive, 7500, 0.03, "highpass");   // 16分ハット
      noiseHit(t + spb * 0.75, 0.03 * drive, 7500, 0.03, "highpass");
    }
    /* 折り返し小節の終わりにスネアの助走(次のループへの期待感) */
    if (isTurn) {
      noiseHit(t0 + spb * 3.5, 0.07, 1800, 0.1, "bandpass");
      noiseHit(t0 + spb * 3.75, 0.09, 1800, 0.1, "bandpass");
    }
    return spb * 4;
  }

  /* 先読みスケジューラ本体。LOOKAHEAD先までの小節をまとめて予約する */
  function tick() {
    const ahead = ac.currentTime + LOOKAHEAD;
    while (nextBarTime < ahead) nextBarTime += scheduleBar(nextBarTime);
  }

  /* 開始(再開)。再生中は何もしないので毎タッチ呼んでよい */
  function start() {
    if (running || CONFIG.BGM_VOLUME <= 0) return;
    SFX.ensure(); // ユーザー操作内で呼ばれる前提(自動再生制限)
    ac = SFX.context();
    if (!ac) return;
    if (bus) bus.disconnect(); // 前回セッションの鳴り残りを切り離す
    buildGraph();
    running = true;
    const t = ac.currentTime;
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.exponentialRampToValueAtTime(CONFIG.BGM_VOLUME, t + 0.6);
    barIdx = 0;
    nextBarTime = t + 0.05;
    tick();
    timer = setInterval(tick, TICK_MS);
  }

  /* フェードアウトして停止。使い終えたバスは切り離して破棄する */
  function stop(fade = CONFIG.BGM_FADE_OUT) {
    if (!running) return;
    running = false;
    clearInterval(timer);
    timer = null;
    const t = ac.currentTime;
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(bus.gain.value, 0.0001), t);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + fade);
    const dead = bus;
    setTimeout(() => {
      if (!running && bus === dead) { dead.disconnect(); bus = null; }
    }, fade * 1000 + 100);
  }

  return { start, stop, bar: () => barIdx };
})();

/* ============================================================
   入力統計: 行別・方向別の正誤を記録する(リザルト画面の核)
   帰属は「実際に打った文字」の行と方向
   ============================================================ */
function newStats() {
  return {
    rows: Object.fromEntries(ALL_ROWS.map((r) => [r, { ok: 0, ng: 0 }])),
    dirs: Array.from({ length: 5 }, () => ({ ok: 0, ng: 0 })),
  };
}
let stats = newStats();

function recordInput(kana, dir, ok) {
  const bucket = ok ? "ok" : "ng";
  stats.dirs[dir][bucket]++;
  if (kana === MOD) return; // 小゛゜は行を持たない(方向のみ記録)
  const row = rowOf(toBase(kana));
  if (row) stats.rows[row][bucket]++; // 句読点・記号は行の統計に含めない
}

/* ---- ゲーム状態: 時間・レベル(固定)・撃破数・コンボ ---- */
const game = {
  combo: 0,
  maxCombo: 0,
  destroyed: 0,   // 撃破数。着地で1戻る
  required: 1,    // このレベルの規定撃破数
  level: 1,       // プレイ中は変わらない
  timeLeft: CONFIG.TIME_LIMIT,
  spurt: false,   // ラストスパート演出に入ったか
  started: false, // スタートボタンを押すまでは動かさない
  over: false,
  cleared: false,
  paused: false,  // 一時停止・設定画面を開いている間
};
let floaters = []; // フィールド上に浮かぶ文字(撃破した語・COMBO・ラスト10秒・-1)

const hudTimeEl = document.getElementById("hud-time");
const hudComboEl = document.getElementById("hud-combo");
const hudLevelEl = document.getElementById("hud-level");
const hudKillsEl = document.getElementById("hud-kills");
const hudProgressEl = document.getElementById("hud-progress");
const overlayEl = document.getElementById("overlay");

/* 数字が増えた瞬間に弾ませる(Web Animations。クラスの付け外しより単純) */
function bump(el, scale = 1.35) {
  el.animate([{ transform: `scale(${scale})` }, { transform: "scale(1)" }],
    { duration: 180, easing: "ease-out" });
}

function updateHud() {
  hudComboEl.textContent = game.combo;
  hudLevelEl.textContent = `LV ${game.level}`;
  hudKillsEl.textContent = `${game.destroyed} / ${game.required}`;
  hudProgressEl.style.width = `${Math.min(game.destroyed / game.required, 1) * 100}%`;
}

let shownSec = -1;      // 表示中の残り秒(毎フレームのDOM更新を避ける)
let shownWarn = false;  // 赤点滅の表示状態
function updateTimer() {
  const sec = Math.max(0, Math.ceil(game.timeLeft));
  const warn = game.spurt && !game.over;
  if (sec !== shownSec) {
    shownSec = sec;
    hudTimeEl.textContent = sec;
  }
  if (warn !== shownWarn) {
    shownWarn = warn;
    hudTimeEl.classList.toggle("warn", warn);
  }
}

/* ターゲティング: ロック中はその隕石だけが対象。
   未ロックなら期待トークンが一致する隕石のうち最も下のものにロックする */
let lockedTarget = null;

function handleGameInput(token) {
  if (!game.started || game.over || game.paused) return null; // 記録対象外
  if (lockedTarget && !meteors.includes(lockedTarget)) lockedTarget = null;
  let target = null;
  if (lockedTarget) {
    if (expectedToken(lockedTarget) === token) target = lockedTarget;
  } else {
    for (const m of meteors) {
      if (expectedToken(m) === token && (!target || m.y > target.y)) target = m;
    }
  }
  if (!target) {
    onMiss(token);
    return false;
  }
  lockedTarget = target;
  game.combo++;
  game.maxCombo = Math.max(game.maxCombo, game.combo);
  SFX.tick(game.combo);
  bump(hudComboEl, 1.25);
  if (game.combo % CONFIG.COMBO_MILESTONE === 0) {
    floaters.push({
      x: fieldW / 2, y: fieldH * 0.28, text: `${game.combo} COMBO!`,
      t: 0, life: 1.2, kind: "combo",
    });
    SFX.comboMilestone();
  }
  target.charProg++;
  if (target.charProg >= target.chars[target.charIdx].tokens.length) {
    target.charIdx++;
    target.charProg = 0;
    spawnParticles(target.x, target.y, CONFIG.HIT_PARTICLES);
  }
  if (target.charIdx >= target.word.len) {
    fireBeam(target, true);
    spawnParticles(target.x, target.y, CONFIG.BOOM_PARTICLES);
    meteors = meteors.filter((m) => m !== target);
    lockedTarget = null;
    SFX.boom();
    onDestroy(target);
  } else {
    fireBeam(target, false);
    if (target.charProg === 0) SFX.crack();
  }
  updateHud();
  return true;
}

function onMiss(token) {
  chipEl.classList.add("miss");
  game.combo = 0;
  SFX.miss();
  updateHud();
}

function onDestroy(meteor) {
  game.destroyed++;
  /* 撃破した語の表記(漢字)を浮かせる。読みしかない語は読みを出す */
  floaters.push({
    x: meteor.x, y: meteor.y, text: meteor.word.display ?? meteor.word.reading,
    t: 0, life: 0.9, kind: "word",
  });
  bump(hudKillsEl, 1.2);
  if (game.destroyed >= game.required) finishGame(true);
}

/* 着地: 撃破数が1戻る(0未満にはならない)。コンボも切れて画面が揺れる */
function onLanded(meteor) {
  dangerFlash = 1;
  shake = CONFIG.SHAKE_AMP;
  game.combo = 0;
  if (game.destroyed > 0) {
    game.destroyed--;
    floaters.push({ x: meteor.x, y: fieldH - 40, text: "-1", t: 0, life: 1.0, kind: "penalty" });
  }
  SFX.land();
  updateHud();
}

/* ---- 記録: レベルごとのベストタイムと、そのときのプレー結果 ---- */
const RECORDS_KEY = "juni.records";
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) ?? {}; }
  catch { return {}; } // プライベートモード等
}
function saveRecords(r) {
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(r)); } catch {}
  markLocalChange();
}
/* クリア済みの最高レベル(未クリアなら0) */
function maxClearedLevel(records = loadRecords()) {
  return Object.keys(records).reduce((m, k) => Math.max(m, Number(k)), 0);
}

/* ============================================================
   クラウド同期(任意): Googleでログインすると記録・設定をサーバー(worker/index.js)に
   保存し、別の端末でも引き継げる。HTML 側は fetch だけで外部スクリプトは読まない。
   ログインは /auth/google/start への画面遷移。戻ってきた起動時に pull() がサーバーの
   データと手元のデータを統合する(記録=レベルごとにタイムが短いほう、設定=更新が新しいほう)。
   手元の保存(saveRecords / saveSettings)は markLocalChange() を通り、ログイン中なら
   少し待ってまとめて push() する。バックエンドが無い配信先では UI ごと非表示
   ============================================================ */
const SYNC_KEY = "juni.sync"; // { updatedAt }: 手元の記録・設定を最後に変えた時刻(設定の新旧比較に使う)
let applyingCloud = false;    // サーバーから受け取ったデータを書き戻している間は「手元の変更」にしない

function localUpdatedAt() {
  try { return Number(JSON.parse(localStorage.getItem(SYNC_KEY))?.updatedAt) || 0; } catch { return 0; }
}
function markLocalChange() {
  if (applyingCloud) return;
  try { localStorage.setItem(SYNC_KEY, JSON.stringify({ updatedAt: Date.now() })); } catch {}
  Cloud.schedulePush();
}

const Cloud = (() => {
  let available = false; // バックエンドが応答したか
  let user = null;       // ログイン中なら { name }
  let status = "";       // 表示用の状態文
  let lastSent = "";     // 最後にサーバーと一致した内容の指紋(差分がなければ送らない)
  let inflight = null;   // 送信中の Promise
  let pending = false;   // 送信中に手元が変わった
  let timer = 0;

  const rootEl = document.getElementById("cloud");
  const loginEl = document.getElementById("cloud-login");
  const userEl = document.getElementById("cloud-user");
  const nameEl = document.getElementById("cloud-name");
  const statusEl = document.getElementById("cloud-status");

  function render() {
    rootEl.classList.toggle("hidden", !available);
    loginEl.classList.toggle("hidden", !!user);
    userEl.classList.toggle("hidden", !user);
    if (user) nameEl.textContent = user.name || "Google アカウント";
    statusEl.textContent = status;
  }
  function setStatus(s) { status = s; render(); }

  function api(method, path, body) {
    return fetch(CLOUD.API + path, {
      method,
      credentials: "same-origin",
      headers: { Accept: "application/json", ...(body !== undefined ? { "Content-Type": "application/json" } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined,
      keepalive: method === "PUT", // 画面を閉じる直前の送信も届くように
    });
  }

  /* 手元の記録・設定を送信用にまとめる */
  function snapshot() {
    return { records: loadRecords(), settings: { ...settings }, updatedAt: localUpdatedAt() };
  }
  function fingerprint(d) { return JSON.stringify({ r: d.records, s: d.settings }); }

  /* 統合: 記録はレベルごとにタイムが短いほう、設定は更新時刻が新しいほう(サーバー側と同じ規則) */
  function mergeData(local, cloud) {
    const records = { ...local.records };
    for (const [lv, rec] of Object.entries(cloud.records ?? {})) {
      if (!records[lv] || rec.time < records[lv].time) records[lv] = rec;
    }
    const cloudNewer = (cloud.updatedAt ?? 0) > local.updatedAt;
    return {
      records,
      settings: cloudNewer ? { ...local.settings, ...cloud.settings } : local.settings,
      updatedAt: Math.max(local.updatedAt, cloud.updatedAt ?? 0),
    };
  }

  /* 統合結果を手元へ書き戻す。プレイ中は設定を触らない(音やヒントが途中で変わらないように) */
  function apply(data) {
    applyingCloud = true;
    try {
      saveRecords(data.records);
      if (!game.started) {
        Object.assign(settings, data.settings);
        saveSettings();
      }
    } finally {
      applyingCloud = false;
    }
    if (!game.started) {
      SFX.setMuted(!settings.sfx);
      renderLevelPicker();
    }
  }

  /* 起動時に1回: ログイン確認 → ログイン中ならサーバーと統合 */
  async function init() {
    const params = new URLSearchParams(location.search);
    const auth = params.get("auth");
    if (auth) history.replaceState(null, "", location.pathname); // ログインから戻った ?auth=... を消す
    try {
      const r = await api("GET", "/me");
      if (!r.ok || !(r.headers.get("Content-Type") ?? "").includes("json")) throw new Error("no backend");
      user = (await r.json()).user;
      available = true;
    } catch {
      available = false;
      render();
      return;
    }
    if (auth === "error") status = "ログインできませんでした";
    render();
    if (user) await pull();
  }

  async function pull() {
    setStatus("同期中…");
    try {
      const r = await api("GET", "/data");
      if (r.status === 401) { user = null; setStatus(""); return; } // セッション切れ
      if (!r.ok) throw new Error(r.status);
      const cloud = (await r.json()).data;
      const local = snapshot();
      apply(cloud ? mergeData(local, cloud) : local);
      lastSent = cloud ? fingerprint(cloud) : "";
      await push(); // 手元にだけあった記録・設定を送る(差分がなければ何もしない)
      setStatus("同期済み");
    } catch {
      setStatus("同期できませんでした");
    }
  }

  function schedulePush() {
    if (!user) return;
    clearTimeout(timer);
    timer = setTimeout(push, CLOUD.PUSH_DELAY * 1000);
  }

  /* 手元の内容をサーバーへ。サーバー側で別端末の記録と統合された結果が返る */
  function push() {
    clearTimeout(timer);
    if (!user) return Promise.resolve();
    if (inflight) { pending = true; return inflight; }
    const data = snapshot();
    const fp = fingerprint(data);
    if (fp === lastSent) return Promise.resolve();
    setStatus("同期中…");
    inflight = (async () => {
      try {
        const r = await api("PUT", "/data", data);
        if (r.status === 401) { user = null; setStatus(""); return; }
        if (!r.ok) throw new Error(r.status);
        const saved = (await r.json()).data;
        lastSent = fingerprint(saved);
        if (lastSent !== fp) apply(saved); // 別端末の記録が統合されて返ってきた
        setStatus("同期済み");
      } catch {
        setStatus("同期できませんでした"); // 次の変更時か画面復帰時に再送する
      } finally {
        inflight = null;
        if (pending) { pending = false; schedulePush(); }
      }
    })();
    return inflight;
  }

  function login() { location.href = CLOUD.LOGIN_URL; }
  async function logout() {
    try { await fetch(CLOUD.LOGOUT_URL, { method: "POST", credentials: "same-origin" }); } catch {}
    user = null;
    lastSent = "";
    setStatus(""); // 手元の記録はそのまま残る
  }

  loginEl.addEventListener("click", login);
  document.getElementById("cloud-logout").addEventListener("click", logout);

  /* 外から渡された記録・設定(引っ越しなど)を手元と統合する。規則はクラウド同期と同じ。
     統合後は markLocalChange() で「今が最新」にする。次のログイン時にこの内容が上がる */
  function absorb(data) {
    apply(mergeData(snapshot(), data));
    markLocalChange();
  }

  return { init, schedulePush, push, absorb, isLoggedIn: () => !!user };
})();

/* ============================================================
   引っ越し(旧配信先 ken-mro.github.io → flick-impact.com)

   記録と設定は localStorage にあり、localStorage はオリジンごとに完全に別物なので、
   旧配信先で遊んでいた人の記録は、放っておくと新ドメインには 1 つも引き継がれない。
   クラウド同期も救いにならない(旧配信先にはバックエンドが無く、誰もログインしていない)。

   そこで旧配信先では「引っ越す」ボタンを出し、記録を URL の # に載せて新ドメインへ渡す。
   # はサーバーへ送信されないので、記録が経路上に残らない。受け取り側は Cloud.absorb() で
   手元と統合する(規則はクラウド同期と同じ = レベルごとにタイムが短いほう)。

   旧と新には同じ index.html が配られる。どちらの役をやるかは配信先のホスト名で決まる
   ============================================================ */
const Migrate = (() => {
  const NEW_URL = "https://flick-impact.com/";
  const PARAM = "migrate";
  /* # はサーバーに送られないので URL 長の実質的な上限はブラウザ側だけ(かなり大きい)。
     それでも短いに越したことはないので、この長さを超えたら行別・方向別の詳細を捨てる。
     現実的なレベル数(数十)では超えないので、これは念のための保険 */
  const MAX_HASH = 30000;
  const CHUNK = 0x2000;         // btoa へ一度に渡す量(引数を広げすぎるとスタックが溢れる)

  const rootEl = document.getElementById("migrate");
  const leadEl = document.getElementById("migrate-lead");
  const noteEl = document.getElementById("migrate-note");
  const btnEl = document.getElementById("btn-migrate");

  /* URL に載せられる形(base64url)。記録には日本語(行の名前)が入るので UTF-8 を経由する */
  function encode(text) {
    const bytes = new TextEncoder().encode(text);
    let bin = "";
    for (let i = 0; i < bytes.length; i += CHUNK) bin += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function decode(text) {
    const bin = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  }

  /* 送る中身。長くなりすぎるときは行別・方向別の詳細を落として、タイムだけでも渡す */
  function pack() {
    const data = { records: loadRecords(), settings: { ...settings }, updatedAt: localUpdatedAt() };
    const full = encode(JSON.stringify(data));
    if (full.length <= MAX_HASH) return full;
    const slim = Object.fromEntries(Object.entries(data.records).map(([lv, r]) => [lv, {
      level: r.level, time: r.time, maxCombo: r.maxCombo, destroyed: r.destroyed, required: r.required,
    }]));
    return encode(JSON.stringify({ ...data, records: slim }));
  }

  /* 受け取ったものの検査。URL は誰でも作れるので、形の合わないものは黙って捨てる */
  function validate(raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
    const records = {};
    for (const [lv, rec] of Object.entries(raw.records ?? {})) {
      if (!/^[0-9]{1,4}$/.test(lv)) continue;
      if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
      if (!Number.isFinite(rec.time) || rec.time <= 0) continue;
      records[lv] = rec;
    }
    const incoming = {};
    for (const [k, def] of Object.entries(settings)) {          // 既知のキーだけ、型が合うものだけ
      const v = raw.settings?.[k];
      if (typeof v === typeof def) incoming[k] = v;
    }
    if (!Object.keys(records).length && !Object.keys(incoming).length) return null;
    return { records, settings: incoming, updatedAt: Number.isFinite(raw.updatedAt) ? raw.updatedAt : 0 };
  }

  function show(lead, note, button = "") {
    leadEl.innerHTML = lead;
    noteEl.textContent = note;
    btnEl.textContent = button;
    btnEl.classList.toggle("hidden", !button);
    rootEl.classList.remove("hidden");
  }

  /* 受け取り側。#migrate=... が付いていたら統合して、URL からは消す */
  function receive() {
    const m = location.hash.match(new RegExp("[#&]" + PARAM + "=([A-Za-z0-9_-]+)"));
    if (!m) return false;
    history.replaceState(null, "", location.pathname + location.search); // 記録入りURLを履歴に残さない
    let data = null;
    try { data = validate(JSON.parse(decode(m[1]))); } catch {}
    if (!data) {
      show("記録を読み取れませんでした", "引っ越し元の画面から、もう一度お試しください");
      return true;
    }
    Cloud.absorb(data);
    const n = Object.keys(data.records).length;
    show(`記録を引き継ぎました(${n}レベル)`,
         "Googleでログインしておくと、次からは端末をまたいで同期されます");
    return true;
  }

  /* 送り側。旧配信先(GitHub Pages)でだけ出す。localhost や新ドメインでは出さない */
  function offer() {
    if (!location.hostname.endsWith(".github.io")) return;
    const n = Object.keys(loadRecords()).length;
    show("このゲームは <b>flick-impact.com</b> へ引っ越しました。",
         n ? "記録は URL に載せて渡します(サーバーには送られません)。この画面の記録も残ります"
           : "まだ記録はありません。そのまま新しい URL でどうぞ",
         n ? "記録を持って引っ越す" : "新しいURLへ");
    btnEl.addEventListener("click", () => { location.href = n ? `${NEW_URL}#${PARAM}=${pack()}` : NEW_URL; });
  }

  return { init: () => { if (!receive()) offer(); } };
})();

/* 正答率(%)。試行がなければ null */
function accuracy(s) {
  const total = s.ok + s.ng;
  return total ? Math.round((s.ok / total) * 100) : null;
}

function statCell(label, value, cls) {
  return `<div class="cell ${cls}">${label}<b>${value}</b></div>`;
}

/* 前回比の矢印HTML。比較できなければ空 */
function arrowHtml(cur, prev) {
  if (cur == null || prev == null || cur === prev) return "";
  return cur > prev ? '<i class="up">↑</i>' : '<i class="down">↓</i>';
}

/* 行別 正答率 / 方向別 ミス率。st は {rows, dirs}(ok/ng)、prev は比較対象の同形(省略可) */
function renderResultStats(st, prev) {
  /* 行別 正答率: 低い行ほど強調。↑↓はベスト記録との比較 */
  document.getElementById("go-rows").innerHTML = ALL_ROWS.map((r) => {
    const acc = accuracy(st.rows[r]);
    const cls = acc === null ? "na" : acc < 70 ? "bad" : acc < 90 ? "warn" : "";
    const prevAcc = prev?.rows?.[r] ? accuracy(prev.rows[r]) : null;
    const arrow = acc === null ? "" : arrowHtml(acc, prevAcc);
    return statCell(r, acc === null ? "—" : `${acc}%${arrow}`, cls);
  }).join("");

  /* 方向別 ミス率: 十字配置。「下フリックが弱い」を可視化する */
  const dirCell = (dir, label) => {
    const s = st.dirs[dir];
    const total = s.ok + s.ng;
    const miss = total ? Math.round((s.ng / total) * 100) : null;
    const cls = miss === null ? "na" : miss >= 30 ? "bad" : miss >= 10 ? "warn" : "";
    return statCell(label, miss === null ? "—" : `${miss}%`, cls);
  };
  document.getElementById("go-dirs").innerHTML = [
    '<div class="cell blank"></div>', dirCell(DIR_UP, "↑"), '<div class="cell blank"></div>',
    dirCell(DIR_LEFT, "←"), dirCell(DIR_CENTER, "中央"), dirCell(DIR_RIGHT, "→"),
    '<div class="cell blank"></div>', dirCell(DIR_DOWN, "↓"), '<div class="cell blank"></div>',
  ].join("");
}

/* リザルト表示。mode: "clear"(今クリア) / "fail"(時間切れ) / "view"(記録の閲覧)
   rec: { level, time, maxCombo, destroyed, required, rows, dirs }
   opts: { prev(比較する前ベスト), isNewBest, best(表示するベスト記録) } */
let currentResult = null; // 共有画像の対象
function showResult(rec, mode, { prev = null, isNewBest = false, best = null } = {}) {
  currentResult = rec;
  const cleared = mode !== "fail";
  const head = cleared ? PIXEL_HEADINGS.CLEAR : PIXEL_HEADINGS.FAIL;
  document.getElementById("go-title").innerHTML = buildPixelSvg([head.text], head.fill);
  document.getElementById("go-hero").classList.toggle("fail", !cleared);
  document.getElementById("go-hero-label").textContent = cleared ? "クリアタイム" : "撃破 / 規定";
  document.getElementById("go-main").innerHTML = cleared
    ? `${rec.time.toFixed(2)}<small>秒</small>`
    : `${rec.destroyed}<small>/ ${rec.required}</small>`;
  document.getElementById("go-rank-wrap").classList.toggle("hidden", !cleared);
  if (cleared) {
    document.getElementById("go-rank-label").innerHTML = buildPixelSvg([PIXEL_HEADINGS.RANK_LABEL], "currentColor", "pixel rank-label");
    document.getElementById("go-rank").innerHTML = buildPixelSvg([rankFor(rec.time)], "currentColor", "pixel rank-letter");
  }
  /* 記録更新バッジ: いったん隠して reflow してから出し、連続で更新したときも弾むアニメを再生する */
  const newBestEl = document.getElementById("go-newbest");
  newBestEl.classList.add("hidden");
  void newBestEl.offsetWidth;
  newBestEl.classList.toggle("hidden", !isNewBest);
  document.getElementById("go-level").textContent = rec.level;
  document.getElementById("go-best-row").classList.toggle("hidden", !best);
  if (best) document.getElementById("go-best").textContent = fmtTime(best.time);
  document.getElementById("go-combo").textContent = rec.maxCombo;
  renderResultStats(rec, prev);
  document.getElementById("go-next").classList.toggle("hidden", mode !== "clear");
  document.getElementById("go-retry").classList.toggle("hidden", mode !== "fail");
  document.getElementById("go-share").classList.toggle("hidden", !cleared);
  document.getElementById("go-close").textContent = mode === "view" ? "閉じる" : "タイトルへ";
  overlayEl.classList.remove("hidden");
}

/* 終了: クリア(規定数到達)または時間切れ。クリア時のみ記録を更新する */
function finishGame(cleared) {
  game.over = true;
  game.cleared = cleared;
  hudTimeEl.classList.remove("warn");
  BGM.stop(); // ジングルの邪魔をしないようフェードアウト
  const records = loadRecords();
  const prev = records[game.level] ?? null;
  const rec = {
    level: game.level,
    time: Math.round((CONFIG.TIME_LIMIT - game.timeLeft) * 100) / 100,
    maxCombo: game.maxCombo,
    destroyed: game.destroyed,
    required: game.required,
    rows: stats.rows,
    dirs: stats.dirs,
    t: Date.now(),
  };
  if (!cleared) {
    SFX.fail();
    showResult(rec, "fail", { prev, best: prev });
    return;
  }
  SFX.clear();
  const isNewBest = !prev || rec.time < prev.time;
  if (isNewBest) {
    records[game.level] = rec;
    saveRecords(records);
    spawnConfetti(CONFIG.CONFETTI);
    SFX.newRecord();
  }
  showResult(rec, "clear", { prev, isNewBest, best: isNewBest ? rec : prev });
}

const levelDescEl = document.getElementById("level-desc");
const startBestEl = document.getElementById("start-best");

function renderLevelPicker() {
  const records = loadRecords();
  const unlocked = maxClearedLevel(records) + 1; // クリア済みの次まで(上限なし)
  settings.startLevel = Math.min(Math.max(settings.startLevel, 1), unlocked);
  pickerEl.innerHTML = "";
  /* 最低 START_LEVEL_SHOWN 個。解放が進めばそのぶん伸び、枠内をスクロールする */
  const shown = Math.max(CONFIG.START_LEVEL_SHOWN, unlocked);
  let activeEl = null;
  for (let lv = 1; lv <= shown; lv++) {
    const b = document.createElement("button");
    b.className = "lv" + (lv > unlocked ? " locked" : "") + (lv === settings.startLevel ? " active" : "");
    b.dataset.level = lv;
    const best = records[lv];
    b.innerHTML = `${lv}<small>${best ? best.time.toFixed(1) + "s" : ""}</small>`;
    if (lv > unlocked) b.disabled = true;
    if (lv === settings.startLevel) activeEl = b;
    pickerEl.appendChild(b);
  }
  activeEl?.scrollIntoView({ block: "nearest" }); // 選択中のレベルが枠外に隠れないように
  /* スクロールが生じるときだけ右余白を取る(スクロールバーと番号の重なり防止) */
  pickerEl.classList.toggle("scrolls", pickerEl.scrollHeight > pickerEl.clientHeight + 1);
  const [lo, hi] = lenRange(settings.startLevel);
  levelDescEl.textContent =
    `LEVEL ${settings.startLevel}: ${levelLabel(settings.startLevel)} ／ ${lo === hi ? lo : `${lo}〜${hi}`}文字 ／ 規定 ${requiredKills(settings.startLevel)}個`;
  const top = maxClearedLevel(records);
  startBestEl.textContent = top ? `LEVEL ${top}` : "—";
  btnRecordsEl.disabled = top === 0;
  /* タイトル待機中は背後のHUDと空色も選んだレベルに追従させる */
  if (!game.started) {
    game.level = settings.startLevel;
    game.required = requiredKills(game.level);
    updateHud();
  }
}

  settings.startLevel = Number(b.dataset.level);

});

/* ============================================================
   SNS共有画像: プレー結果を正方形の1枚絵に描く(外部依存なし・canvas)
   ============================================================ */
function buildShareImage(rec) {
  const W = CONFIG.SHARE_W, H = CONFIG.SHARE_H;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const g = c.getContext("2d");
  const [top, bottom] = skyFor(rec.level);
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, rgbStr(top));
  grad.addColorStop(1, rgbStr(bottom));
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  g.fillStyle = PALETTE.STAR;
  for (const s of makeStars(160, W, H)) {
    g.globalAlpha = s.a;
    g.beginPath();
    g.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  g.textAlign = "center";
  g.textBaseline = "middle";

  const FONT_U = "'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', sans-serif";

  /* タイトル(ドット文字ロゴ) */
  drawPixelText(g, LOGO.LINES, W / 2, CONFIG.SHARE_LOGO_TOP, CONFIG.SHARE_LOGO_UNIT, PALETTE.SHARE_LOGO);

  /* 見出し: LEVEL n CLEAR(ドット文字) */
  drawPixelText(g, [`LEVEL ${rec.level}  CLEAR`], W / 2, CONFIG.SHARE_HEAD_TOP, CONFIG.SHARE_HEAD_UNIT, [PALETTE.SHARE_ACCENT]);

  /* クリアタイム(主役) */
  g.fillStyle = PALETTE.SHARE_TEXT;
  g.font = `800 210px ${FONT_U}`;
  const timeStr = rec.time.toFixed(2);
  const tw = g.measureText(timeStr).width;
  g.fillText(timeStr, W / 2 - 30, 520);
  g.font = `700 54px ${FONT_U}`;
  g.fillStyle = PALETTE.SHARE_DIM;
  g.textAlign = "left";
  g.fillText("秒", W / 2 - 30 + tw / 2 + 18, 560);
  g.textAlign = "center";

  /* ランク(ドット文字)・コンボ */
  drawPixelText(g, [`${PIXEL_HEADINGS.RANK_LABEL} ${rankFor(rec.time)}`], W / 2, CONFIG.SHARE_RANK_TOP, CONFIG.SHARE_RANK_UNIT, [PALETTE.SHARE_RANK]);
  g.fillStyle = PALETTE.SHARE_DIM;
  g.font = `600 36px ${FONT_U}`;
  g.fillText(`最大コンボ ${rec.maxCombo}`, W / 2, 730);

  /* 行別正答率: 10マス */
  const cellW = 92, cellH = 96, gap = 8;
  const x0 = (W - (cellW * 10 + gap * 9)) / 2;
  const y0 = 800;
  ALL_ROWS.forEach((r, i) => {
    const x = x0 + i * (cellW + gap);
    const acc = accuracy(rec.rows[r]);
    g.fillStyle = PALETTE.SHARE_CELL;
    g.beginPath();
    g.roundRect(x, y0, cellW, cellH, 12);
    g.fill();
    g.fillStyle = PALETTE.SHARE_DIM;
    g.font = `600 30px ${FONT_U}`;
    g.fillText(r, x + cellW / 2, y0 + 30);
    g.fillStyle = acc === null ? PALETTE.SHARE_DIM : acc < 70 ? PALETTE.SHARE_BAD : acc < 90 ? PALETTE.SHARE_ACCENT : PALETTE.SHARE_TEXT;
    g.font = `700 28px ${FONT_U}`;
    g.fillText(acc === null ? "—" : `${acc}%`, x + cellW / 2, y0 + 68);
  });

  /* フッター */
  g.fillStyle = PALETTE.SHARE_TEXT;
  g.font = `600 34px ${FONT_U}`;
  g.fillText("フリック入力で地球を守れ", W / 2, 975);
  g.fillStyle = PALETTE.SHARE_DIM;
  g.font = `500 30px ${FONT_U}`;
  g.fillText(CONFIG.SITE_URL, W / 2, 1030);
  return c;
}

/* 共有: Web Share API(共有シート)が使えればそれで。使えなければ画像を表示して長押し保存/ダウンロード */
const shareEl = document.getElementById("share");
const shareImgEl = document.getElementById("share-img");
const shareDlEl = document.getElementById("share-dl");
let shareUrl = null;
async function shareResult() {
  const rec = currentResult;
  if (!rec) return;
  const canvas = buildShareImage(rec);
  const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
  if (!blob) return;
  const name = `flick-impact-level${rec.level}.png`;
  const text = `FLICK IMPACT — LEVEL ${rec.level} を ${fmtTime(rec.time)} でクリア！ https://${CONFIG.SITE_URL}`;
  if (typeof File === "function" && navigator.canShare) {
    const file = new File([blob], name, { type: "image/png" });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text });
        return;
      } catch (e) {
        if (e.name === "AbortError") return; // ユーザーが共有を取り消した
        // それ以外はフォールバックへ
      }
    }
  }
  if (shareUrl) URL.revokeObjectURL(shareUrl);
  shareUrl = URL.createObjectURL(blob);
  shareImgEl.src = shareUrl;
  shareDlEl.href = shareUrl;
  shareDlEl.download = name;
  shareEl.classList.remove("hidden");
}
document.getElementById("go-share").addEventListener("click", shareResult);
